<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curakid Admin - Вхід</title>
    <th:block th:replace="~{admin/fragments :: head-links}"></th:block>
</head>
<body class="login-page">

    <div class="login-card">
        <h1>Curakid Admin</h1>
        <p>Увійдіть, щоб керувати системою</p>

        <form id="login-form">
            <div class="form-group">
                <label for="email">Електронна пошта</label>
                <input type="text" id="email" class="form-control" required placeholder="email@example.com">
            </div>
            
            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" class="form-control" required placeholder="••••••••">
            </div>

            <button type="submit" class="btn" id="submit-btn">Увійти</button>
        </form>
    </div>
    <div th:replace="~{admin/fragments :: scripts}"></div>
    <div id="toast-container" class="toast-container"></div>

    <script th:src="@{/admin/js/login.js}"></script>
</body>
</html>
