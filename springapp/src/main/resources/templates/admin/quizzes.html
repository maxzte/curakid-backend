<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curakid Admin - Quizzes</title>
    <th:block th:replace="admin/fragments :: head-links"></th:block>
</head>
<body>

    <div th:replace="~{admin/fragments :: sidebar('quizzes')}"></div>
    <div th:replace="~{admin/fragments :: scripts}"></div>

    <div class="main-content">
        <div class="header">
            <h2>Керування опитуваннями</h2>
        </div>

        <!-- Life Periods Tree -->
        <div class="card">
            <h3>Вікові періоди та запитання</h3>
            <div id="periods-container">
                <div class="empty-state">Завантаження...</div>
            </div>
        </div>
    </div>

    <script>
        let allQuestionsGlobal = [];
        fetchPeriods();

        // Unified toast is used via AdminAuth.showToast

        function setPeriodCreateStatus(type = '', text = '') {
            const el = document.getElementById('period-create-status');
            el.textContent = text;
            el.className = type ? `inline-status ${type}` : 'inline-status';
        }

        function normalizePeriodsPayload(payload) {
            if (Array.isArray(payload)) return payload;
            if (!payload || typeof payload !== 'object') return [];
            if (Array.isArray(payload.data)) return payload.data;
            if (Array.isArray(payload.content)) return payload.content;
            if (Array.isArray(payload.items)) return payload.items;
            if (Array.isArray(payload.lifePeriods)) return payload.lifePeriods;
            return [];
        }

        function normalizePeriod(period) {
            const questions = Array.isArray(period.questions)
                ? period.questions
                : (Array.isArray(period.quizQuestions) ? period.quizQuestions : []);

            return {
                ...period,
                minMonths: period.minMonths ?? period.min_months ?? period.min,
                maxMonths: period.maxMonths ?? period.max_months ?? period.max,
                questions
            };
        }

        // --- Fetch & Render ---
        async function fetchPeriods() {
            try {
                const response = await AdminAuth.apiFetch('/api/v1/admin/quiz/life-periods');
                if (!response) return;
                
                const payload = await response.json();
                const periods = normalizePeriodsPayload(payload).map(normalizePeriod);

                // Build global questions list for prerequisites dropdown
                allQuestionsGlobal = periods.flatMap(p => p.questions || []).filter(q => q.id);

                renderPeriods(periods);
            } catch (err) {
                AdminAuth.showToast(err.message, 'error');
                document.getElementById('periods-container').innerHTML =
                    '<div class="empty-state">Не вдалося завантажити періоди.</div>';
            }
        }

        function renderPeriods(periods) {
            const container = document.getElementById('periods-container');

            if (periods.length === 0) {
                container.innerHTML = '<div class="empty-state">Вікових періодів не знайдено. Додайте новий вище.</div>';
                return;
            }

            container.innerHTML = periods.map(p => `
                <div class="period-card" data-period-id="${p.id}">
                    <div class="period-header" onclick="togglePeriod(this)">
                        <div class="period-info">
                            <span class="toggle">▶</span>
                            <strong>${AdminAuth.escapeHtml(p.label)}</strong>
                            <span class="badge">${AdminAuth.escapeHtml(p.code)}</span>
                            <span style="color: var(--text-muted); font-size: 0.85rem;">${p.minMonths}–${p.maxMonths} мiс</span>
                            <span style="color: var(--text-muted); font-size: 0.85rem;">(${p.questions ? p.questions.length : 0} питань)</span>
                        </div>
                    </div>
                    <div class="period-body">
                        ${renderQuestions(p.questions || [], p.id)}

                        <hr class="section-divider">
                        <strong style="font-size: 0.95rem; display: block; margin-bottom: 0.5rem; color: var(--primary);">Додати запитання</strong>
                        <div class="add-inline-form" style="flex-direction: column; align-items: stretch;">
                            <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
                                <div class="inline-field" style="flex: 2; min-width: 250px;">
                                    <label>Текст запитання</label>
                                    <input type="text" placeholder="Напр: Чи може дитина тримати голову?" id="q-text-${p.id}">
                                </div>
                                <div class="inline-field">
                                    <label>Домен розвитку</label>
                                    <select id="q-domain-${p.id}">
                                        <option value="MOTOR_GROSS">Груба моторика</option>
                                        <option value="MOTOR_FINE">Дрібна моторика</option>
                                        <option value="SPEECH">Мовлення</option>
                                        <option value="COGNITIVE">Пізнання</option>
                                        <option value="SOCIAL_EMOTIONAL">Соціально-емоційний</option>
                                        <option value="SELF_CARE">Самообслуговування</option>
                                        <option value="SENSORY">Сенсорний</option>
                                    </select>
                                </div>
                                <div class="inline-field">
                                    <label>Вага</label>
                                    <input type="number" min="0.0" max="1.0" placeholder="1.0" step="0.1" value="1.0" id="q-weight-${p.id}" style="width: 80px;">
                                </div>
                                <div class="inline-field" style="flex: 1; min-width: 200px;">
                                    <label>Базова навичка (Prerequisite)</label>
                                    <select id="q-prereq-${p.id}" style="width: 100%;">
                                        <option value="">Без передумови</option>
                                        ${allQuestionsGlobal.map(aq => `<option value="${aq.id}">${aq.text.substring(0, 50)}...</option>`).join('')}
                                    </select>
                                </div>
                            </div>
                            
                            <div style="margin-top: 1rem; padding-top: 0.5rem; border-top: 1px dashed var(--border);">
                                <label style="font-size: 0.8rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase;">Варіанти відповідей:</label>
                                <div id="q-options-container-${p.id}" style="display: flex; flex-direction: column; gap: 0.5rem; margin-top: 0.5rem;">
                                    <div class="flex-row q-option-row" style="align-items: center; gap: 0.5rem;">
                                        <input type="text" class="q-opt-text" value="Так" placeholder="Текст варіанту" style="flex: 1; padding: 0.4rem 0.6rem; border: 1px solid var(--border); border-radius: 6px; font-size: 0.9rem;">
                                        <input type="number" step="any" min="0" max="100" class="q-opt-value" value="100.0" placeholder="Значення" style="width: 80px; padding: 0.4rem 0.6rem; border: 1px solid var(--border); border-radius: 6px; font-size: 0.9rem;">
                                        <button class="btn btn-sm btn-danger" onclick="this.parentElement.remove()" style="padding: 0.2rem 0.5rem;">×</button>
                                    </div>
                                    <div class="flex-row q-option-row" style="align-items: center; gap: 0.5rem;">
                                        <input type="text" class="q-opt-text" value="Іноді" placeholder="Текст варіанту" style="flex: 1; padding: 0.4rem 0.6rem; border: 1px solid var(--border); border-radius: 6px; font-size: 0.9rem;">
                                        <input type="number" step="any" min="0" max="100" class="q-opt-value" value="50.0" placeholder="Значення" style="width: 80px; padding: 0.4rem 0.6rem; border: 1px solid var(--border); border-radius: 6px; font-size: 0.9rem;">
                                        <button class="btn btn-sm btn-danger" onclick="this.parentElement.remove()" style="padding: 0.2rem 0.5rem;">×</button>
                                    </div>
                                    <div class="flex-row q-option-row" style="align-items: center; gap: 0.5rem;">
                                        <input type="text" class="q-opt-text" value="Ще ні" placeholder="Текст варіанту" style="flex: 1; padding: 0.4rem 0.6rem; border: 1px solid var(--border); border-radius: 6px; font-size: 0.9rem;">
                                        <input type="number" step="any" min="0" max="100" class="q-opt-value" value="0.0" placeholder="Значення" style="width: 80px; padding: 0.4rem 0.6rem; border: 1px solid var(--border); border-radius: 6px; font-size: 0.9rem;">
                                        <button class="btn btn-sm btn-danger" onclick="this.parentElement.remove()" style="padding: 0.2rem 0.5rem;">×</button>
                                    </div>
                                </div>
                                <button class="btn btn-sm" onclick="addOptionRowToNewQuestion('${p.id}')" style="margin-top: 0.5rem; background-color: var(--bg-color); color: var(--text-main); border: 1px solid var(--border);">+ Додати варіант</button>
                            </div>
                            
                            <div style="margin-top: 1rem; display: flex; justify-content: flex-end;">
                                <button class="btn btn-sm btn-success" onclick="addQuestion('${p.id}')">Додати запитання</button>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function renderQuestions(questions, periodId) {
            const domains = [
                { value: 'MOTOR_GROSS', label: 'Груба моторика' },
                { value: 'MOTOR_FINE', label: 'Дрібна моторика' },
                { value: 'SPEECH', label: 'Мовлення' },
                { value: 'COGNITIVE', label: 'Пізнання' },
                { value: 'SOCIAL_EMOTIONAL', label: 'Соціально-емоційний' },
                { value: 'SELF_CARE', label: 'Самообслуговування' },
                { value: 'SENSORY', label: 'Сенсорний' }
            ];

            if (questions.length === 0) {
                return '<div class="empty-state" style="padding: 1rem;">No questions yet.</div>';
            }

            return questions.map(q => `
                <div class="question-item">
                    <div class="question-header" style="flex-direction: column; align-items: stretch; gap: 1rem;">
                        <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                            <div onclick="toggleOptions(this)" style="cursor: pointer; user-select: none; display: flex; align-items: center; gap: 0.5rem;">
                                <span class="toggle-icon" style="font-size: 0.7rem; color: var(--text-muted);">▶</span>
                                <strong style="color: var(--primary);">Питання</strong>
                            </div>
                            <div style="display: flex; gap: 0.5rem;">
                                <button class="btn btn-sm btn-success" onclick="updateQuestionData('${q.id}')">✓</button>
                                <button class="btn btn-sm btn-danger" onclick="deleteQuestion('${q.id}')">Delete</button>
                            </div>
                        </div>

                        <div class="flex-row" style="flex-wrap: wrap; gap: 0.75rem;">
                            <div class="inline-field" style="flex: 2; min-width: 250px;">
                                <label style="font-size: 0.7rem;">Текст запитання</label>
                                <input type="text" value="${q.text}" id="q-text-edit-${q.id}" style="width: 100%; padding: 0.4rem 0.6rem; border: 1px solid var(--border); border-radius: 6px; font-size: 0.9rem;">
                            </div>
                            <div class="inline-field">
                                <label style="font-size: 0.7rem;">Домен</label>
                                <select id="q-domain-edit-${q.id}" style="padding: 0.4rem 0.6rem; border: 1px solid var(--border); border-radius: 6px; font-size: 0.9rem; background: white;">
                                    ${domains.map(d => `<option value="${d.value}" ${q.domain === d.value ? 'selected' : ''}>${d.label}</option>`).join('')}
                                </select>
                            </div>
                            <div class="inline-field">
                                <label style="font-size: 0.7rem;">Вага</label>
                                <input type="number" step="0.1" value="${q.weight}" id="q-weight-edit-${q.id}" style="width: 65px; padding: 0.4rem 0.6rem; border: 1px solid var(--border); border-radius: 6px; font-size: 0.9rem;">
                            </div>
                            <div class="inline-field" style="flex: 1; min-width: 200px;">
                                <label style="font-size: 0.7rem;">Базова навичка</label>
                                <select id="q-prereq-edit-${q.id}" style="width: 100%; padding: 0.4rem 0.6rem; border: 1px solid var(--border); border-radius: 6px; font-size: 0.9rem; background: white;">
                                    <option value="">Без передумови</option>
                                    ${allQuestionsGlobal.filter(aq => aq.id !== q.id).map(aq => `
                                        <option value="${aq.id}" ${q.prerequisite?.id === aq.id ? 'selected' : ''}>
                                            ${aq.text.substring(0, 50)}...
                                        </option>
                                    `).join('')}
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="options-list">
                        <label style="font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 0.5rem; display: block;">Варіант відповіді</label>
                        ${(q.options || []).map(o => `
                            <div class="option-item" style="gap: 0.5rem;">
                                <input type="text" id="o-text-edit-${o.id}" value="${o.text}" style="flex: 1; border: 1px solid transparent; background: transparent; padding: 0.2rem; font-size: 0.9rem;">
                                <input type="number" step="any" min="0" max="100" id="o-value-edit-${o.id}" value="${o.value}" style="width: 60px; border: 1px solid transparent; background: transparent; padding: 0.2rem; font-size: 0.8rem; color: var(--text-muted);">
                                <input type="number" id="o-order-edit-${o.id}" value="${o.order}" style="width: 40px; border: 1px solid transparent; background: transparent; padding: 0.2rem; font-size: 0.8rem; color: var(--text-muted);">
                                <button class="btn btn-sm btn-success" onclick="updateOption('${o.id}')" style="padding: 0.2rem 0.5rem; font-size: 0.75rem;">✓</button>
                                <button class="btn btn-sm btn-danger" onclick="deleteOption('${o.id}')" style="padding: 0.2rem 0.5rem; font-size: 0.75rem;">×</button>
                            </div>
                        `).join('')}

                        <div class="add-inline-form" style="margin-top: 1rem; background: #ffffff;">
                            <div class="inline-field" style="flex: 1;">
                                <label>Текст варіанту</label>
                                <input type="text" placeholder="Напр: Так" id="o-text-${q.id}">
                            </div>
                            <div class="inline-field">
                                <label>Значення</label>
                                <input type="number" step="any" min="0" max="100" placeholder="100.0" id="o-value-${q.id}" style="width: 80px;">
                            </div>
                            <div class="inline-field">
                                <label>Порядок</label>
                                <input type="number" placeholder="1" value="${(q.options || []).length + 1}" id="o-order-${q.id}" style="width: 70px;">
                            </div>
                            <button class="btn btn-sm btn-success" onclick="addOption('${q.id}')" style="height: 42px; font-size: 0.85rem;">+ Додати варіант</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function togglePeriod(headerEl) {
            const body = headerEl.nextElementSibling;
            const toggle = headerEl.querySelector('.toggle');
            body.classList.toggle('open');
            toggle.classList.toggle('open');
        }

        function toggleOptions(headerEl) {
            const container = headerEl.closest('.question-item');
            const list = container.querySelector('.options-list');
            const icon = headerEl.querySelector('.toggle-icon');

            const isOpen = list.classList.toggle('open');
            icon.textContent = isOpen ? '▼' : '▶';
        }

        function addOptionRowToNewQuestion(periodId) {
            const container = document.getElementById(`q-options-container-${periodId}`);
            const div = document.createElement('div');
            div.className = 'flex-row q-option-row';
            div.style.alignItems = 'center';
            div.style.gap = '0.5rem';
            div.innerHTML = `
                <input type="text" class="q-opt-text" placeholder="Текст варіанту" style="flex: 1; padding: 0.4rem 0.6rem; border: 1px solid var(--border); border-radius: 6px; font-size: 0.9rem;">
                <input type="number" step="any" min="0" max="100" class="q-opt-value" placeholder="Значення" style="width: 80px; padding: 0.4rem 0.6rem; border: 1px solid var(--border); border-radius: 6px; font-size: 0.9rem;">
                <button class="btn btn-sm btn-danger" onclick="this.parentElement.remove()" style="padding: 0.2rem 0.5rem;">×</button>
            `;
            container.appendChild(div);
        }

        // --- Actions ---
        async function addQuestion(periodId) {
            const text = document.getElementById(`q-text-${periodId}`).value;
            const domain = document.getElementById(`q-domain-${periodId}`).value;
            const weight = parseFloat(document.getElementById(`q-weight-${periodId}`).value);
            const prerequisiteId = document.getElementById(`q-prereq-${periodId}`).value || null;

            const container = document.getElementById(`q-options-container-${periodId}`);
            const optionRows = container.querySelectorAll('.q-option-row');
            const options = [];
            
            optionRows.forEach((row, index) => {
                const optText = row.querySelector('.q-opt-text').value;
                const optValStr = row.querySelector('.q-opt-value').value;
                const optValue = parseFloat(optValStr);
                if (optText && !isNaN(optValue)) {
                    options.push({
                        text: optText,
                        value: optValue,
                        displayOrder: index + 1
                    });
                }
            });

            if (options.some(o => o.value < 0 || o.value > 100)) {
                AdminAuth.showToast('Значення варіантів мають бути від 0 до 100', 'error');
                return;
            }

            if (!text) { AdminAuth.showToast('Текст запитання обов’язковий', 'error'); return; }

            try {
                const resp = await AdminAuth.apiFetch(`/api/v1/admin/quiz/life-periods/${periodId}/questions`, {
                    method: 'POST',
                    body: JSON.stringify({ text, domain, weight, options, prerequisiteId })
                });
                if (resp && resp.ok) {
                    AdminAuth.showToast('Запитання додано', 'success');
                    fetchPeriods();
                }
            } catch (err) { AdminAuth.showToast(err.message, 'error'); }
        }

        async function updateQuestionData(id) {
            const text = document.getElementById(`q-text-edit-${id}`).value;
            const domain = document.getElementById(`q-domain-edit-${id}`).value;
            const weight = parseFloat(document.getElementById(`q-weight-edit-${id}`).value);
            const prerequisiteId = document.getElementById(`q-prereq-edit-${id}`).value || null;

            if (!text) { AdminAuth.showToast('Текст запитання обов’язковий', 'error'); return; }

            try {
                const resp = await AdminAuth.apiFetch(`/api/v1/admin/quiz/questions/${id}`, {
                    method: 'PUT',
                    body: JSON.stringify({ text, domain, weight, prerequisiteId })
                });
                if (resp && resp.ok) {
                    AdminAuth.showToast('Запитання оновлено', 'success');
                    fetchPeriods();
                }
            } catch (err) { AdminAuth.showToast(err.message, 'error'); }
        }

        async function deleteQuestion(id) {
            if (!confirm('Видалити це запитання та всі його варіанти?')) return;
            try {
                const resp = await AdminAuth.apiFetch(`/api/v1/admin/quiz/questions/${id}`, {
                    method: 'DELETE'
                });
                if (resp && resp.ok) {
                    AdminAuth.showToast('Запитання видалено', 'success');
                    fetchPeriods();
                }
            } catch (err) { AdminAuth.showToast(err.message, 'error'); }
        }

        async function addOption(questionId) {
            const text = document.getElementById(`o-text-${questionId}`).value;
            const value = document.getElementById(`o-value-${questionId}`).value;
            const displayOrder = parseInt(document.getElementById(`o-order-${questionId}`).value) || 1;

            const valueFloat = parseFloat(value);
            if (isNaN(valueFloat) || valueFloat < 0 || valueFloat > 100) {
                AdminAuth.showToast('Значення має бути числом від 0 до 100', 'error');
                return;
            }

            if (!text) { AdminAuth.showToast('Текст варіанту обов’язковий', 'error'); return; }

            try {
                const resp = await AdminAuth.apiFetch(`/api/v1/admin/quiz/questions/${questionId}/options`, {
                    method: 'POST',
                    body: JSON.stringify({ text, value: valueFloat, displayOrder })
                });
                if (resp && resp.ok) {
                    AdminAuth.showToast('Варіант додано', 'success');
                    fetchPeriods();
                }
            } catch (err) { AdminAuth.showToast(err.message, 'error'); }
        }

        async function updateOption(id) {
            const text = document.getElementById(`o-text-edit-${id}`).value;
            const value = document.getElementById(`o-value-edit-${id}`).value;
            const displayOrder = parseInt(document.getElementById(`o-order-edit-${id}`).value) || 0;

            const valueFloat = parseFloat(value);
            if (isNaN(valueFloat) || valueFloat < 0 || valueFloat > 100) {
                AdminAuth.showToast('Значення має бути числом від 0 до 100', 'error');
                return;
            }

            try {
                const resp = await AdminAuth.apiFetch(`/api/v1/admin/quiz/options/${id}`, {
                    method: 'PUT',
                    body: JSON.stringify({ text, value: valueFloat, displayOrder })
                });
                if (resp && resp.ok) {
                    AdminAuth.showToast('Варіант оновлено', 'success');
                    fetchPeriods();
                }
            } catch (err) { AdminAuth.showToast(err.message, 'error'); }
        }

        async function deleteOption(id) {
            if (!confirm('Ви впевнені?')) return;
            try {
                const resp = await AdminAuth.apiFetch(`/api/v1/admin/quiz/options/${id}`, {
                    method: 'DELETE'
                });
                if (resp && resp.ok) {
                    AdminAuth.showToast('Option deleted', 'success');
                    fetchPeriods();
                }
            } catch (err) { AdminAuth.showToast(err.message, 'error'); }
        }

        // Init
        fetchPeriods();
    </script>
</body>
</html>
