<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curakid Admin - Quizzes</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --bg-color: #F3F4F6;
            --surface: #FFFFFF;
            --text-main: #111827;
            --text-muted: #6B7280;
            --border: #E5E7EB;
            --error: #EF4444;
            --success: #10B981;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 280px;
            background-color: var(--surface);
            border-right: 1px solid var(--border);
            padding: 2rem;
            box-shadow: 2px 0 8px rgba(0,0,0,0.05);
        }

        .sidebar h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 2rem;
            margin-top: 0;
        }

        .nav-item {
            display: block;
            padding: 0.75rem 1rem;
            color: var(--text-muted);
            text-decoration: none;
            border-radius: 8px;
            margin-bottom: 0.5rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .nav-item:hover, .nav-item.active {
            background-color: #EEF2FF;
            color: var(--primary);
        }

        .main-content {
            flex: 1;
            padding: 2rem 4rem;
            max-width: 1200px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .header h2 {
            font-size: 1.875rem;
            margin: 0;
            font-weight: 700;
        }

        .card {
            background-color: var(--surface);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03);
            margin-bottom: 2rem;
        }

        .card h3 {
            margin-top: 0;
            margin-bottom: 1.5rem;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.4rem;
            color: var(--text-main);
            font-size: 0.95rem;
        }

        .form-hint {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 0.3rem;
            font-weight: 400;
        }

        .form-control {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-family: inherit;
            font-size: 1rem;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            box-sizing: border-box;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .flex-row {
            display: flex;
            gap: 1rem;
        }

        .flex-row .form-group {
            flex: 1;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn:disabled {
            background-color: var(--text-muted);
            cursor: not-allowed;
        }

        .btn-sm {
            padding: 0.4rem 0.8rem;
            font-size: 0.85rem;
        }

        .btn-danger {
            background-color: var(--error);
        }

        .btn-danger:hover {
            background-color: #DC2626;
        }

        .btn-success {
            background-color: var(--success);
        }

        .btn-success:hover {
            background-color: #059669;
        }

        .alert {
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            display: none;
            font-weight: 500;
        }

        .alert.success {
            background-color: #D1FAE5;
            color: #065F46;
            display: block;
        }

        .alert.error {
            background-color: #FEE2E2;
            color: #991B1B;
            display: block;
        }

        .badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 500;
            background-color: #EEF2FF;
            color: var(--primary);
        }

        /* Tree structure styles */
        .period-card {
            border: 1px solid var(--border);
            border-radius: 12px;
            margin-bottom: 1.5rem;
            overflow: hidden;
        }

        .period-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.5rem;
            background-color: #F9FAFB;
            cursor: pointer;
            user-select: none;
        }

        .period-header:hover {
            background-color: #F3F4F6;
        }

        .period-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .period-info .toggle {
            font-size: 0.75rem;
            color: var(--text-muted);
            transition: transform 0.2s ease;
        }

        .period-info .toggle.open {
            transform: rotate(90deg);
        }

        .period-body {
            display: none;
            padding: 1rem 1.5rem;
            border-top: 1px solid var(--border);
        }

        .period-body.open {
            display: block;
        }

        .question-item {
            background-color: #FAFAFA;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 0.75rem;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.5rem;
        }

        .options-list {
            padding-left: 1.5rem;
            margin-top: 0.5rem;
        }

        .option-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.4rem 0.75rem;
            margin-bottom: 0.25rem;
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.9rem;
        }

        .option-value {
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        .add-inline-form {
            display: flex;
            gap: 1rem;
            align-items: flex-end;
            margin-top: 1rem;
            flex-wrap: wrap;
            background: #f8fafc;
            padding: 1.25rem;
            border-radius: 10px;
            border: 1px dashed var(--border);
        }

        .inline-field {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .inline-field label {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.025em;
            color: var(--text-muted);
        }

        .add-inline-form input,
        .add-inline-form select {
            padding: 0.6rem 0.8rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.95rem;
            background-color: white;
        }

        .add-inline-form input:focus,
        .add-inline-form select:focus {
            outline: none;
            border-color: var(--primary);
        }

        .section-divider {
            border: none;
            border-top: 1px solid var(--border);
            margin: 1rem 0;
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 2rem;
            font-style: italic;
        }

        .inline-status {
            margin-top: 0.75rem;
            font-size: 0.9rem;
            font-weight: 500;
            min-height: 1.2rem;
        }

        .inline-status.success {
            color: #065F46;
        }

        .inline-status.error {
            color: #991B1B;
        }

        .inline-status.loading {
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h1>Curakid Admin</h1>
        <nav>
            <a href="/admin/ui/articles" class="nav-item">База знань</a>
            <a href="/admin/ui/periods" class="nav-item">Вікові періоди</a>
            <a href="/admin/ui/quizzes" class="nav-item active">Опитування</a>
            <a href="/admin/ui/vaccines" class="nav-item">Календар щеплень</a>
            <a href="/admin/ui/rules" class="nav-item">Нечіткі правила</a>
            <a href="/admin/ui/users" class="nav-item">Користувачі</a>
            <a href="#" onclick="logout()" class="nav-item" style="color: var(--error); margin-top: 2rem;">Вийти</a>
        </nav>
    </div>

    <div class="main-content">
        <div class="header">
            <h2>Керування опитуваннями</h2>
        </div>

        <div id="status-message" class="alert"></div>

        <!-- Add Life Period Form -->
        <div class="card">
            <h3>Додати новий віковий період</h3>
            <form id="add-period-form">
                <div class="flex-row">
                    <div class="form-group">
                        <label for="period-code">Код періоду</label>
                        <input type="text" id="period-code" class="form-control" required placeholder="Напр: P0_3M">
                        <span class="form-hint">Технічний ID (напр: P0_3M для 0-3 міс.)</span>
                    </div>
                    <div class="form-group">
                        <label for="period-label">Назва періоду</label>
                        <input type="text" id="period-label" class="form-control" required placeholder="Напр: 0–3 місяці">
                        <span class="form-hint">Як це бачить користувач</span>
                    </div>
                </div>
                <div class="flex-row">
                    <div class="form-group">
                        <label for="period-min">Мін. вік (місяці)</label>
                        <input type="number" id="period-min" class="form-control" required placeholder="0">
                    </div>
                    <div class="form-group">
                        <label for="period-max">Макс. вік (місяці)</label>
                        <input type="number" id="period-max" class="form-control" required placeholder="3">
                    </div>
                </div>
                <button type="submit" class="btn">Створити період</button>
                <div id="period-create-status" class="inline-status"></div>
            </form>
        </div>

        <!-- Life Periods Tree -->
        <div class="card">
            <h3>Вікові періоди та питання</h3>
            <div id="periods-container">
                <div class="empty-state">Loading...</div>
            </div>
        </div>
    </div>

    <script>
        if (!localStorage.getItem('curakid_admin_token')) {
            window.location.href = '/admin/ui/login';
        }

        function logout() {
            localStorage.removeItem('curakid_admin_token');
            window.location.href = '/admin/ui/login';
        }

        function getAuthHeader() {
            let token = localStorage.getItem('curakid_admin_token');
            if (!token) return {};
            return { 'Authorization': token.startsWith('Bearer ') ? token : 'Bearer ' + token };
        }

        function showMessage(text, type) {
            const el = document.getElementById('status-message');
            el.textContent = text;
            el.className = 'alert ' + type;
            setTimeout(() => { el.className = 'alert'; }, 5000);
        }

        function setPeriodCreateStatus(type = '', text = '') {
            const el = document.getElementById('period-create-status');
            el.textContent = text;
            el.className = type ? `inline-status ${type}` : 'inline-status';
        }

        function normalizePeriodsPayload(payload) {
            if (Array.isArray(payload)) return payload;
            if (!payload || typeof payload !== 'object') return [];
            if (Array.isArray(payload.data)) return payload.data;
            if (Array.isArray(payload.content)) return payload.content;
            if (Array.isArray(payload.items)) return payload.items;
            if (Array.isArray(payload.lifePeriods)) return payload.lifePeriods;
            return [];
        }

        function normalizePeriod(period) {
            const questions = Array.isArray(period.questions)
                ? period.questions
                : (Array.isArray(period.quizQuestions) ? period.quizQuestions : []);

            return {
                ...period,
                minMonths: period.minMonths ?? period.min_months ?? period.min,
                maxMonths: period.maxMonths ?? period.max_months ?? period.max,
                questions
            };
        }

        // --- Fetch & Render ---
        async function fetchPeriods() {
            try {
                const response = await fetch('/api/admin/quiz/life-periods', {
                    headers: getAuthHeader()
                });
                if (!response.ok) throw new Error("Failed to fetch life periods");

                const payload = await response.json();
                const periods = normalizePeriodsPayload(payload).map(normalizePeriod);
                renderPeriods(periods);
            } catch (err) {
                showMessage(err.message, 'error');
                document.getElementById('periods-container').innerHTML =
                    '<div class="empty-state">Failed to load periods.</div>';
            }
        }

        function renderPeriods(periods) {
            const container = document.getElementById('periods-container');

            if (periods.length === 0) {
                container.innerHTML = '<div class="empty-state">No life periods found. Add one above.</div>';
                return;
            }

            container.innerHTML = periods.map(p => `
                <div class="period-card" data-period-id="${p.id}">
                    <div class="period-header" onclick="togglePeriod(this)">
                        <div class="period-info">
                            <span class="toggle">▶</span>
                            <strong>${p.label}</strong>
                            <span class="badge">${p.code}</span>
                            <span style="color: var(--text-muted); font-size: 0.85rem;">${p.minMonths}–${p.maxMonths} мiс</span>
                            <span style="color: var(--text-muted); font-size: 0.85rem;">(${p.questions ? p.questions.length : 0} питань)</span>
                        </div>
                        <button class="btn btn-sm btn-danger" onclick="event.stopPropagation(); deletePeriod('${p.id}')">Delete</button>
                    </div>
                    <div class="period-body">
                        ${renderQuestions(p.questions || [], p.id)}

                        <hr class="section-divider">
                        <strong style="font-size: 0.95rem; display: block; margin-bottom: 0.5rem; color: var(--primary);">Додати запитання</strong>
                        <div class="add-inline-form">
                            <div class="inline-field" style="flex: 2; min-width: 250px;">
                                <label>Текст запитання</label>
                                <input type="text" placeholder="Напр: Чи може дитина тримати голову?" id="q-text-${p.id}">
                            </div>
                            <div class="inline-field">
                                <label>Домен розвитку</label>
                                <select id="q-domain-${p.id}">
                                    <option value="MOTOR">Моторика</option>
                                    <option value="SPEECH">Мовлення</option>
                                    <option value="COGNITIVE">Пізнання</option>
                                    <option value="SOCIAL">Соціалізація</option>
                                </select>
                            </div>
                            <div class="inline-field">
                                <label>Вага</label>
                                <input type="number" placeholder="1.0" step="0.1" value="1.0" id="q-weight-${p.id}" style="width: 80px;">
                            </div>
                            <button class="btn btn-sm btn-success" onclick="addQuestion('${p.id}')" style="height: 42px;">Додати</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function renderQuestions(questions, periodId) {
            if (questions.length === 0) {
                return '<div class="empty-state" style="padding: 1rem;">No questions yet.</div>';
            }

            return questions.map(q => `
                <div class="question-item">
                    <div class="question-header">
                        <div>
                            <strong>${q.text}</strong>
                            <div style="margin-top: 0.25rem;">
                                <span class="badge">${q.domain}</span>
                                <span style="color: var(--text-muted); font-size: 0.85rem; margin-left: 0.5rem;">weight: ${q.weight}</span>
                            </div>
                        </div>
                        <button class="btn btn-sm btn-danger" onclick="deleteQuestion('${q.id}')">Delete</button>
                    </div>

                    <div class="options-list">
                        ${(q.options || []).map(o => `
                            <div class="option-item">
                                <span>${o.text} <span class="option-value">(value: ${o.value})</span></span>
                                <button class="btn btn-sm btn-danger" onclick="deleteOption('${o.id}')" style="padding: 0.2rem 0.5rem; font-size: 0.75rem;">×</button>
                            </div>
                        `).join('')}

                        <div class="add-inline-form" style="margin-top: 1rem; background: #ffffff;">
                            <div class="inline-field" style="flex: 1;">
                                <label>Текст варіанту</label>
                                <input type="text" placeholder="Напр: Так" id="o-text-${q.id}">
                            </div>
                            <div class="inline-field">
                                <label>Значення</label>
                                <input type="text" placeholder="1.0" id="o-value-${q.id}" style="width: 80px;">
                            </div>
                            <div class="inline-field">
                                <label>Порядок</label>
                                <input type="number" placeholder="1" value="${(q.options || []).length + 1}" id="o-order-${q.id}" style="width: 70px;">
                            </div>
                            <button class="btn btn-sm btn-success" onclick="addOption('${q.id}')" style="height: 42px; font-size: 0.85rem;">+ Додати варіант</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function togglePeriod(headerEl) {
            const body = headerEl.nextElementSibling;
            const toggle = headerEl.querySelector('.toggle');
            body.classList.toggle('open');
            toggle.classList.toggle('open');
        }

        // --- Actions ---
        async function deletePeriod(id) {
            if (!confirm('Delete this life period and all its questions?')) return;
            try {
                const resp = await fetch(`/api/admin/quiz/life-periods/${id}`, {
                    method: 'DELETE',
                    headers: getAuthHeader()
                });
                if (!resp.ok) throw new Error('Failed to delete period');
                showMessage('Period deleted', 'success');
                fetchPeriods();
            } catch (err) { showMessage(err.message, 'error'); }
        }

        async function addQuestion(periodId) {
            const text = document.getElementById(`q-text-${periodId}`).value;
            const domain = document.getElementById(`q-domain-${periodId}`).value;
            const weight = parseFloat(document.getElementById(`q-weight-${periodId}`).value);

            if (!text) { showMessage('Question text is required', 'error'); return; }

            try {
                const resp = await fetch(`/api/admin/quiz/life-periods/${periodId}/questions`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', ...getAuthHeader() },
                    body: JSON.stringify({ text, domain, weight })
                });
                if (!resp.ok) throw new Error('Failed to add question');
                showMessage('Question added', 'success');
                fetchPeriods();
            } catch (err) { showMessage(err.message, 'error'); }
        }

        async function deleteQuestion(id) {
            if (!confirm('Delete this question and all its options?')) return;
            try {
                const resp = await fetch(`/api/admin/quiz/questions/${id}`, {
                    method: 'DELETE',
                    headers: getAuthHeader()
                });
                if (!resp.ok) throw new Error('Failed to delete question');
                showMessage('Question deleted', 'success');
                fetchPeriods();
            } catch (err) { showMessage(err.message, 'error'); }
        }

        async function addOption(questionId) {
            const text = document.getElementById(`o-text-${questionId}`).value;
            const value = document.getElementById(`o-value-${questionId}`).value;
            const displayOrder = parseInt(document.getElementById(`o-order-${questionId}`).value) || 1;

            if (!text || !value) { showMessage('Option text and value are required', 'error'); return; }

            try {
                const resp = await fetch(`/api/admin/quiz/questions/${questionId}/options`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', ...getAuthHeader() },
                    body: JSON.stringify({ text, value, displayOrder })
                });
                if (!resp.ok) throw new Error('Failed to add option');
                showMessage('Option added', 'success');
                fetchPeriods();
            } catch (err) { showMessage(err.message, 'error'); }
        }

        async function deleteOption(id) {
            try {
                const resp = await fetch(`/api/admin/quiz/options/${id}`, {
                    method: 'DELETE',
                    headers: getAuthHeader()
                });
                if (!resp.ok) throw new Error('Failed to delete option');
                showMessage('Option deleted', 'success');
                fetchPeriods();
            } catch (err) { showMessage(err.message, 'error'); }
        }

        // --- Create Period Form ---
        document.getElementById('add-period-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitButton = e.target.querySelector('button[type="submit"]');
            submitButton.disabled = true;
            setPeriodCreateStatus('loading', 'Creating period...');

            const payload = {
                code: document.getElementById('period-code').value,
                label: document.getElementById('period-label').value,
                minMonths: parseInt(document.getElementById('period-min').value),
                maxMonths: parseInt(document.getElementById('period-max').value)
            };

            try {
                const resp = await fetch('/api/admin/quiz/life-periods', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', ...getAuthHeader() },
                    body: JSON.stringify(payload)
                });
                if (!resp.ok) throw new Error('Failed to create period');
                showMessage('Period created!', 'success');
                setPeriodCreateStatus('success', `Period "${payload.label}" created successfully`);
                e.target.reset();
                await fetchPeriods();
            } catch (err) {
                showMessage(err.message, 'error');
                setPeriodCreateStatus('error', err.message);
            } finally {
                submitButton.disabled = false;
            }
        });

        // Init
        fetchPeriods();
    </script>
</body>
</html>
