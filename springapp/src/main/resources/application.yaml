spring:
  profiles:
    active: local

  application:
    name: curakid

  autoconfigure:
    exclude:
      - io.sentry.spring.boot.jakarta.SentryAutoConfiguration

  threads:
    virtual:
      enabled: true

  lifecycle:
    timeout-per-shutdown-phase: 30s

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:50}
      minimum-idle: ${HIKARI_MIN_IDLE:10}
      idle-timeout: 30000
      connection-timeout: 20000
      keepalive-time: 30000
      max-lifetime: 1800000
      leak-detection-threshold: 10000
      validation-timeout: 3000

  data:
    redis:
      repositories:
        enabled: false
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT}
      password: ${SPRING_DATA_REDIS_PASSWORD}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:64}
          max-idle: ${REDIS_POOL_MAX_IDLE:32}
          min-idle: ${REDIS_POOL_MIN_IDLE:8}
          max-wait: 2000ms

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: ${SPRING_KAFKA_CONSUMER_GROUP_ID:curakid-notification-group}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.misterio.curakid.*"
        spring.jackson.deserialization.fail-on-null-for-primitives: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3

  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 3000
          writetimeout: 5000
        debug: false

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          timezone: UTC
          use_get_generated_keys: true
          batch_size: ${HIBERNATE_BATCH_SIZE:50}
          lob:
            non_contextual_creation: true
        order_inserts: true
        order_updates: true

  ai:
    vectorstore:
      pgvector:
        initialize-schema: true
    google:
      genai:
        chat:
          options:
            model: gemini-2.5-flash-lite
        api-key: ${GOOGLE_AI_API_KEY}
        embedding:
          text:
            options:
              dimensions: 768
          api-key: ${GOOGLE_AI_API_KEY}
  sql:
    init:
      mode: always

fis:
  base-url: ${FIS_BASE_URL}
  internal-api-key: ${INTERNAL_API_KEY}
  timeout-seconds: 15
  chat-timeout-seconds: 3

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:900000} # 15 minutes
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000} # 7 days

firebase:
  credentials-path: ${FIREBASE_CREDENTIALS_PATH}

google:
  client-id: ${GOOGLE_CLIENT_ID}

logging:
  level:
    #    com.misterio.curakid: DEBUG
    #    web: DEBUG
    #    web.filter.CommonsRequestLoggingFilter: DEBUG
    root: INFO
    org.springframework: INFO
    hibernate: INFO

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: native
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:200}
      min-spare: ${TOMCAT_MIN_SPARE:20}
    accept-count: ${TOMCAT_ACCEPT_COUNT:1000}
    max-connections: ${TOMCAT_MAX_CONNECTIONS:10000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080}

sentry:
  dsn: ${SENTRY_DSN:}
  traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:0.1}
  send-default-pii: false
