<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curakid Admin - Календар щеплень</title>
    <th:block th:replace="admin/fragments :: head-links"></th:block>
</head>
<body>

    <div th:replace="~{admin/fragments :: sidebar('vaccines')}"></div>

    <div class="main-content">
        <div class="header">
            <h2>Національний календар щеплень</h2>
        </div>

        <div class="card">
            <h3 id="form-title">Додати нове щеплення</h3>
            <form id="vaccine-form">
                <input type="hidden" id="vaccine-id">
                <div class="flex-row">
                    <div class="form-group">
                        <label for="name">Назва вакцини</label>
                        <input type="text" id="name" class="form-control" required placeholder="Напр: БЦЖ, АКДП">
                    </div>
                    <div class="form-group">
                        <label for="disease">Хвороба</label>
                        <input type="text" id="disease" class="form-control" required placeholder="Напр: Туберкульоз">
                    </div>
                </div>

                <div class="flex-row">
                    <div class="form-group">
                        <label for="doseNumber">Номер дози</label>
                        <input type="number" id="doseNumber" class="form-control" required value="1">
                    </div>
                    <div class="form-group">
                        <label for="totalDoses">Всього доз у серії</label>
                        <input type="number" id="totalDoses" class="form-control" required value="1">
                    </div>
                    <div class="form-group">
                        <label for="type">Тип</label>
                        <select id="type" class="form-control">
                            <option value="VACCINATION">Вакцинація</option>
                            <option value="REVACCINATION">Ревакцинація</option>
                        </select>
                    </div>
                </div>

                <div class="flex-row">
                    <div class="form-group">
                        <label for="scheduledAgeMonths">Вік (місяці)</label>
                        <input type="number" id="scheduledAgeMonths" class="form-control" placeholder="Напр: 2">
                    </div>
                    <div class="form-group">
                        <label for="scheduledAgeDays">Вік (дні)</label>
                        <input type="number" id="scheduledAgeDays" class="form-control" placeholder="Для новонароджених">
                    </div>
                </div>

                <div class="form-group">
                    <label for="notes">Примітки</label>
                    <textarea id="notes" class="form-control" rows="2"></textarea>
                </div>

                <button type="submit" class="btn" id="submit-btn">Зберегти щеплення</button>
                <button type="button" class="btn" id="cancel-btn" style="background-color: var(--text-muted); display: none;" onclick="resetForm()">Скасувати</button>
            </form>
        </div>

        <div class="card">
            <h3>Список щеплень</h3>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Назва</th>
                            <th>Хвороба</th>
                            <th>Доза</th>
                            <th>Вік</th>
                            <th>Тип</th>
                            <th>Дії</th>
                        </tr>
                    </thead>
                    <tbody id="vaccines-table-body">
                        <tr>
                            <td colspan="6" style="text-align: center; color: var(--text-muted);">Завантаження...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div th:replace="~{admin/fragments :: scripts}"></div>

    <script>
        fetchVaccines();


        async function fetchVaccines() {
            try {
                const response = await AdminAuth.apiFetch('/api/admin/vaccines');
                if (!response) return;
                
                const vaccines = await response.json();
                const tbody = document.getElementById('vaccines-table-body');
                
                if (vaccines.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align: center;">Нічого не знайдено.</td></tr>';
                    return;
                }

                tbody.innerHTML = vaccines.map(v => `
                    <tr>
                        <td style="font-weight: 600;">${v.name}</td>
                        <td>${v.disease}</td>
                        <td>${v.doseNumber}/${v.totalDoses}</td>
                        <td>${v.scheduledAgeMonths ? v.scheduledAgeMonths + ' міс.' : (v.scheduledAgeDays ? v.scheduledAgeDays + ' дн.' : '-')}</td>
                        <td><span class="badge">${v.type === 'VACCINATION' ? 'Вакц.' : 'Ревакц.'}</span></td>
                        <td>
                            <button class="edit-btn" onclick="editVaccine('${v.id}')">Редагувати</button>
                            <button class="delete-btn" onclick="deleteVaccine('${v.id}')">Видалити</button>
                        </td>
                    </tr>
                `).join('');
            } catch (err) {
                AdminAuth.showToast('Помилка завантаження: ' + err.message, 'error');
            }
        }

        document.getElementById('vaccine-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('vaccine-id').value;
            const payload = {
                name: document.getElementById('name').value,
                disease: document.getElementById('disease').value,
                doseNumber: parseInt(document.getElementById('doseNumber').value),
                totalDoses: parseInt(document.getElementById('totalDoses').value),
                type: document.getElementById('type').value,
                scheduledAgeMonths: document.getElementById('scheduledAgeMonths').value ? parseInt(document.getElementById('scheduledAgeMonths').value) : null,
                scheduledAgeDays: document.getElementById('scheduledAgeDays').value ? parseInt(document.getElementById('scheduledAgeDays').value) : null,
                notes: document.getElementById('notes').value
            };

            try {
                const url = id ? `/api/admin/vaccines/${id}` : '/api/admin/vaccines';
                const method = id ? 'PUT' : 'POST';
                
                const response = await AdminAuth.apiFetch(url, {
                    method: method,
                    body: JSON.stringify(payload)
                });

                if (response && response.ok) {
                    AdminAuth.showToast('Збережено успішно!', 'success');
                    resetForm();
                    fetchVaccines();
                }
            } catch (err) {
                AdminAuth.showToast(err.message, 'error');
            }
        });

        async function deleteVaccine(id) {
            if (!confirm('Ви впевнені?')) return;
            try {
                const response = await AdminAuth.apiFetch(`/api/admin/vaccines/${id}`, {
                    method: 'DELETE'
                });
                if (response && response.ok) {
                    AdminAuth.showToast('Видалено', 'success');
                    fetchVaccines();
                }
            } catch (err) {
                AdminAuth.showToast(err.message, 'error');
            }
        }

        window.editVaccine = async function(id) {
            try {
                const response = await AdminAuth.apiFetch('/api/admin/vaccines');
                if (!response) return;
                const vaccines = await response.json();
                const v = vaccines.find(v => v.id === id);
                if (v) {
                    document.getElementById('vaccine-id').value = v.id;
                    document.getElementById('name').value = v.name;
                    document.getElementById('disease').value = v.disease;
                    document.getElementById('doseNumber').value = v.doseNumber;
                    document.getElementById('totalDoses').value = v.totalDoses;
                    document.getElementById('type').value = v.type;
                    document.getElementById('scheduledAgeMonths').value = v.scheduledAgeMonths || '';
                    document.getElementById('scheduledAgeDays').value = v.scheduledAgeDays || '';
                    document.getElementById('notes').value = v.notes || '';
                    
                    document.getElementById('form-title').textContent = 'Редагувати щеплення';
                    document.getElementById('submit-btn').textContent = 'Оновити щеплення';
                    document.getElementById('cancel-btn').style.display = 'inline-block';
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            } catch (err) {}
        }

        function resetForm() {
            document.getElementById('vaccine-form').reset();
            document.getElementById('vaccine-id').value = '';
            document.getElementById('form-title').textContent = 'Додати нове щеплення';
            document.getElementById('submit-btn').textContent = 'Зберегти щеплення';
            document.getElementById('cancel-btn').style.display = 'none';
        }
    </script>
</body>
</html>
