<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curakid Admin - Вхід</title>
    <th:block th:replace="~{admin/fragments :: head-links}"></th:block>
</head>
<body class="login-page">

    <div class="login-card">
        <h1>Curakid Admin</h1>
        <p>Увійдіть, щоб керувати системою</p>

        <form id="login-form">
            <div class="form-group">
                <label for="email">Електронна пошта</label>
                <input type="text" id="email" class="form-control" required placeholder="email@example.com">
            </div>
            
            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" class="form-control" required placeholder="••••••••">
            </div>

            <button type="submit" class="btn" id="submit-btn">Увійти</button>
        </form>
    </div>
    <div th:replace="~{admin/fragments :: scripts}"></div>
    <div id="toast-container" class="toast-container"></div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            
            const payload = {
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            };

            try {
                btn.disabled = true;
                btn.textContent = 'Authenticating...';

                // 1. Attempt login
                const response = await fetch('/api/v1/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    if (response.status === 401 || response.status === 403) {
                        throw new Error("Invalid email or password.");
                    }
                    throw new Error("Login failed.");
                }

                const data = await response.json();
                const token = data.accessToken;
                
                // 2. Verify admin access by attempting an admin route
                const adminCheck = await fetch('/api/v1/admin/users', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                
                if (!adminCheck.ok) {
                    throw new Error("Access denied. You do not have administrator privileges.");
                }

                // 3. Success -> save token and redirect
                document.cookie = `admin_token=${token}; path=/; SameSite=Strict`;
                localStorage.setItem('accessToken', token);
                localStorage.setItem('curakid_admin_token', token);
                window.location.href = '/admin/ui/articles';

            } catch (err) {
                AdminAuth.showToast(err.message, 'error');
                btn.disabled = false;
                btn.textContent = 'Увійти';
            }
        });
    </script>
</body>
</html>
