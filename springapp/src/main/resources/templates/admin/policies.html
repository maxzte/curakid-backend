<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curakid Admin - Політики</title>
    <th:block th:replace="admin/fragments :: head-links"></th:block>
</head>
<body>

    <div th:replace="~{admin/fragments :: sidebar('policies')}"></div>
    <div th:replace="~{admin/fragments :: scripts}"></div>

    <div class="main-content">
        <div class="header">
            <h2>Керування юридичними документами</h2>
        </div>

        <!-- Add Document Form -->
        <div class="card">
            <h3>Додати новий документ</h3>
            <form id="policy-form">
                <div class="flex-row">
                    <div class="form-group">
                        <label for="doc-type">Тип документу</label>
                        <select id="doc-type" class="form-control">
                            <option value="TERMS">Умови використання (Terms)</option>
                            <option value="PRIVACY_POLICY">Політика конфіденційності (Privacy Policy)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="doc-version">Версія</label>
                        <input type="text" id="doc-version" class="form-control" required placeholder="Напр: 1.0.0">
                    </div>
                </div>

                <div class="form-group">
                    <label for="doc-url">URL документу</label>
                    <input type="url" id="doc-url" class="form-control" required placeholder="https://example.com/terms-v1.0.0.pdf">
                </div>

                <button type="submit" class="btn" id="submit-btn">Зберегти документ</button>
            </form>
        </div>

        <!-- Documents Table -->
        <div class="card">
            <h3>Список документів</h3>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Тип</th>
                            <th>Версія</th>
                            <th>URL</th>
                            <th>Статус</th>
                            <th>Дата публікації</th>
                            <th>Дії</th>
                        </tr>
                    </thead>
                    <tbody id="policies-table-body">
                        <tr>
                            <td colspan="6" style="text-align: center; color: var(--text-muted);">Завантаження...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        fetchDocuments();

        async function fetchDocuments() {
            try {
                const response = await AdminAuth.apiFetch('/api/v1/admin/legal');
                if (!response) return;

                const docs = await response.json();
                renderTable(docs);
            } catch (err) {
                AdminAuth.showToast('Помилка завантаження: ' + err.message, 'error');
            }
        }

        function typeLabel(type) {
            if (type === 'TERMS') return 'Умови використання';
            if (type === 'PRIVACY_POLICY') return 'Політика конфіденційності';
            return type;
        }

        function renderTable(docs) {
            const tbody = document.getElementById('policies-table-body');

            if (!docs || docs.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center;">Документів не знайдено.</td></tr>';
                return;
            }

            // Sort: active first, then by publishedAt desc
            docs.sort((a, b) => {
                if (a.isActive !== b.isActive) return a.isActive ? -1 : 1;
                return new Date(b.publishedAt) - new Date(a.publishedAt);
            });

            tbody.innerHTML = docs.map(d => {
                const date = new Date(d.publishedAt).toLocaleDateString('uk-UA', {
                    day: '2-digit', month: '2-digit', year: 'numeric',
                    hour: '2-digit', minute: '2-digit'
                });

                const statusBadge = d.isActive
                    ? '<span class="badge" style="background: var(--success, #22c55e); color: #fff;">Активний</span>'
                    : '<span class="badge" style="background: var(--text-muted); color: #fff;">Неактивний</span>';

                const activateBtn = !d.isActive
                    ? `<button class="edit-btn" onclick="activateDoc('${d.id}')">Активувати</button>`
                    : '';

                const deactivateBtn = d.isActive
                    ? `<button class="delete-btn" onclick="deactivateDoc('${d.id}')">Деактивувати</button>`
                    : '';

                const safeVersion = AdminAuth.escapeHtml(d.version);
                const safeUrl = AdminAuth.escapeHtml(d.url);
                const shortUrl = AdminAuth.escapeHtml(d.url.length > 40 ? d.url.substring(0, 40) + '…' : d.url);

                return `
                    <tr>
                        <td style="font-weight: 600;">${typeLabel(d.type)}</td>
                        <td><span class="badge">${safeVersion}</span></td>
                        <td>
                            <a href="${safeUrl}" target="_blank" title="${safeUrl}"
                               style="color: var(--primary); text-decoration: none; font-size: 0.85rem;">
                                ${shortUrl}
                            </a>
                        </td>
                        <td>${statusBadge}</td>
                        <td style="font-size: 0.85rem; color: var(--text-muted);">${date}</td>
                        <td style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
                            ${activateBtn}
                            ${deactivateBtn}
                        </td>
                    </tr>
                `;
            }).join('');
        }

        document.getElementById('policy-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const payload = {
                type: document.getElementById('doc-type').value,
                version: document.getElementById('doc-version').value.trim(),
                url: document.getElementById('doc-url').value.trim(),
            };

            if (!payload.version) {
                AdminAuth.showToast('Версія обов\'язкова', 'error');
                return;
            }

            try {
                const response = await AdminAuth.apiFetch('/api/v1/admin/legal', {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });

                if (response && response.ok) {
                    AdminAuth.showToast('Документ додано. Активуйте його якщо потрібно.', 'success');
                    document.getElementById('policy-form').reset();
                    fetchDocuments();
                } else if (response) {
                    const err = await response.json().catch(() => ({}));
                    AdminAuth.showToast(err.message || 'Помилка збереження', 'error');
                }
            } catch (err) {
                AdminAuth.showToast(err.message, 'error');
            }
        });

        async function activateDoc(id) {
            if (!confirm('Активувати цей документ? Попередня активна версія цього типу буде автоматично деактивована.')) return;
            try {
                const response = await AdminAuth.apiFetch(`/api/v1/admin/legal/${id}/activate`, {
                    method: 'POST'
                });
                if (response && response.ok) {
                    AdminAuth.showToast('Документ активовано', 'success');
                    fetchDocuments();
                } else if (response) {
                    const err = await response.json().catch(() => ({}));
                    AdminAuth.showToast(err.message || 'Помилка активації', 'error');
                }
            } catch (err) {
                AdminAuth.showToast(err.message, 'error');
            }
        }

        async function deactivateDoc(id) {
            if (!confirm('Деактивувати цей документ?')) return;
            try {
                const response = await AdminAuth.apiFetch(`/api/v1/admin/legal/${id}/deactivate`, {
                    method: 'POST'
                });
                if (response && response.ok) {
                    AdminAuth.showToast('Документ деактивовано', 'success');
                    fetchDocuments();
                } else if (response) {
                    const err = await response.json().catch(() => ({}));
                    AdminAuth.showToast(err.message || 'Помилка деактивації', 'error');
                }
            } catch (err) {
                AdminAuth.showToast(err.message, 'error');
            }
        }
    </script>
</body>
</html>
