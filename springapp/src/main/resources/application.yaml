spring:
  application:
    name: curakid

  datasource:
    driver-class-name: org.postgresql.Driver
#    url: jdbc:postgresql://127.0.0.1:54332/postgres?options=-c%20search_path%3Dpublic,extensions
#    username: postgres
#    password: postgres

    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  ai:
    vectorstore:
      pgvector:
        initialize-schema: true
    vertex:
      ai:
        gemini:
          project-id: ${GOOGLE_CLOUD_PROJECT_ID}
          location: ${GOOGLE_CLOUD_LOCATION:us-central1}
          chat:
            options:
              model: gemini-1.5-flash
              temperature: 0.3
  sql:
    init:
      mode: always

server:
  port: 8080

fis:
  base-url: ${FIS_BASE_URL:http://intelligence:8000}
  internal-api-key: ${INTERNAL_API_KEY:change-me}
  timeout-seconds: 5

jwt:
  secret: ${JWT_SECRET:defaultSecretKeyMustBeAtLeast32CharactersLong!}
  access-token-expiration: 900000    # 15 minutes
  refresh-token-expiration: 604800000 # 7 days

google:
  client-id: ${GOOGLE_CLIENT_ID:}

logging:
  level:
    web: DEBUG
    web.filter.CommonsRequestLoggingFilter: DEBUG