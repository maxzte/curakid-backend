<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curakid Admin | Fuzzy Logic Studio</title>
    <th:block th:replace="~{admin/fragments :: head-links}"></th:block>
</head>
<body>

    <div th:replace="~{admin/fragments :: sidebar('rules')}"></div>
    <div th:replace="~{admin/fragments :: scripts}"></div>

    <div class="main-content">
        <div class="header" style="margin-bottom: 3rem; padding-bottom: 1.5rem; border-bottom: 1px solid #e5e7eb;">
            <h2 style="margin: 0 0 0.75rem 0; color: var(--text-main); font-size: 2.25rem; font-weight: 800; letter-spacing: -0.025em;">Студія нечіткої логіки</h2>
        </div>

        <div class="">
            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                    <h3 style="margin: 0;">Активні правила аналізу</h3>
                    <div style="display: flex; gap: 0.5rem;">
                        <button class="btn-secondary" onclick="openJsonEditor()" style="background-color: var(--text-muted); color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 8px; font-weight: 600; cursor: pointer;">
                            <i class="fas fa-code" style="margin-right: 0.5rem;"></i> JSON Редактор
                        </button>
                        <button class="btn-primary" onclick="saveAllRules()">
                            <i class="fas fa-save" style="margin-right: 0.5rem;"></i> Оновити Intelligence
                        </button>
                    </div>
                </div>

                <div id="rules-container">
                    <!-- Rules will be injected here -->
                </div>

                <div style="margin-top: 2rem; display: flex; justify-content: flex-end;">
                    <button class="btn" onclick="addNewRule()">+ Додати нове правило</button>
                </div>
            </div>
        </div>
    </div>

    <!-- JSON Editor Modal -->
    <div id="json-modal" class="modal">
        <div class="modal-content" style="max-width: 800px; max-height: 90vh; display: flex; flex-direction: column;">
            <div class="modal-header">
                <h3>JSON Редактор правил</h3>
                <span class="close-modal" onclick="closeJsonEditor()">&times;</span>
            </div>
            <p style="color: var(--text-muted); margin-bottom: 1rem;">
                Пряме редагування матриці правил у форматі JSON. Застосування автоматично завантажить їх у матрицю та збереже на сервері.
            </p>
            <div style="flex: 1; min-height: 300px; display: flex; flex-direction: column;">
                <textarea id="rules-json" class="form-control" style="flex: 1; font-family: monospace; font-size: 0.85rem; resize: vertical; min-height: 300px; background-color: #1e293b; color: #f8fafc; padding: 1rem; border-radius: 8px;"></textarea>
            </div>
            <div style="display: flex; gap: 1rem; justify-content: flex-end; margin-top: 1.5rem;">
                <button type="button" class="btn btn-secondary" onclick="closeJsonEditor()">Скасувати</button>
                <button type="button" class="btn" onclick="applyJsonRules()">Застосувати та зберегти</button>
            </div>
        </div>
    </div>

    <script th:src="@{/admin/js/rules.js}"></script>
</body>
</html>
