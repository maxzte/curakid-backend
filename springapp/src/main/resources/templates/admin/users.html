<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curakid Admin - Users</title>
    <th:block th:replace="admin/fragments :: head-links"></th:block>
</head>
<body>

    <div th:replace="~{admin/fragments :: sidebar('users')}"></div>
    <div th:replace="~{admin/fragments :: scripts}"></div>

    <div class="main-content">
        <div class="header">
            <h2>Користувачі системи</h2>
        </div>

        <div class="card">
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Ім'я</th>
                            <th>Email</th>
                            <th>Роль</th>
                            <th>Статус</th>
                            <th>ID</th>
                        </tr>
                    </thead>
                    <tbody id="users-table-body">
                        <tr>
                            <td colspan="5" style="text-align: center; color: var(--text-muted);">Завантаження користувачів...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>

        async function fetchUsers() {
            try {
                const response = await AdminAuth.apiFetch('/api/admin/users');
                if (!response) return;
                
                if (!response.ok) throw new Error("Помилка завантаження користувачів.");

                const users = await response.json();
                const tbody = document.getElementById('users-table-body');
                
                if (users.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: var(--text-muted);">Користувачів не знайдено.</td></tr>';
                    return;
                }

                tbody.innerHTML = users.map(user => {
                    const roleClass = user.role === 'ADMIN' ? 'user' : 'admin';
                    const roleName = user.role === 'ADMIN' ? 'Користувач' : 'Адмін';
                    const statusClass = user.isActive ? 'inactive' : 'active';
                    const statusText = user.isActive ? 'Неактивний' : 'Активний';
                    
                    return `
                    <tr>
                        <td style="font-weight: 500;">${user.fullName}</td>
                        <td>${user.email}</td>
                        <td><span class="badge ${roleClass}">${roleName}</span></td>
                        <td><span class="status-dot ${statusClass}"></span> ${statusText}</td>
                        <td style="color: var(--text-muted); font-size: 0.85rem; font-family: monospace;">${user.id}</td>
                    </tr>
                `}).join('');

            } catch (err) {
                AdminAuth.showToast(err.message, 'error');
            }
        }

        fetchUsers();
    </script>
</body>
</html>
