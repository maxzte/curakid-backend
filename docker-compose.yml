name: curakid

services:
  backend:
    container_name: curakid-backend
    image: curakid-backend:latest
    build:
      context: .
      dockerfile: springapp/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      - SPRING_MAIL_HOST=${SPRING_MAIL_HOST}
      - SPRING_MAIL_PORT=${SPRING_MAIL_PORT}
      - SPRING_MAIL_USERNAME=${SPRING_MAIL_USERNAME}
      - SPRING_MAIL_PASSWORD=${SPRING_MAIL_PASSWORD}
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - SPRING_DATA_REDIS_HOST=${SPRING_DATA_REDIS_HOST}
      - SPRING_DATA_REDIS_PORT=${SPRING_DATA_REDIS_PORT}
      - SPRING_DATA_REDIS_PASSWORD=${SPRING_DATA_REDIS_PASSWORD}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=${SPRING_KAFKA_BOOTSTRAP_SERVERS}
      - SPRING_KAFKA_CONSUMER_GROUP_ID=${SPRING_KAFKA_CONSUMER_GROUP_ID:-curakid-notification-group}
      - GOOGLE_AI_API_KEY=${GOOGLE_AI_API_KEY}
      - SPRING_AI_GOOGLE_GENAI_API_KEY=${GOOGLE_AI_API_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - FIS_BASE_URL=${FIS_BASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - FIREBASE_CREDENTIALS_PATH=/app/serviceAccountKey.json
      - SPRING_AI_GOOGLE_GENAI_EMBEDDING_MODEL=text-embedding-004
      - SPRING_MAIN_LAZY_INITIALIZATION=true
      - SPRING_JMX_ENABLED=false
      - SPRING_JPA_PROPERTIES_HIBERNATE_QUERY_PLAN_CACHE_MAX_SIZE=128
      - JAVA_OPTS=-XX:+UseG1GC -XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 2048M
    volumes:
      - ./springapp/build/libs/springapp.jar:/app/springapp.jar
      - ./serviceAccountKey.json:/app/serviceAccountKey.json:ro
    networks:
      - curakid-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      intelligence:
        condition: service_healthy
    develop:
      watch:
        - action: rebuild
          path: ./springapp
        - action: rebuild
          path: ./core/essential
        - action: rebuild
          path: ./core/security
        - action: rebuild
          path: ./core/database
        - action: rebuild
          path: ./feature/auth
        - action: rebuild
          path: ./feature/children
        - action: rebuild
          path: ./feature/development
        - action: rebuild
          path: ./feature/measurements
        - action: rebuild
          path: ./feature/knowledge
        - action: rebuild
          path: ./feature/reports
        - action: rebuild
          path: ./feature/notification
        - action: rebuild
          path: ./feature/fis
        - action: rebuild
          path: ./feature/event
        - action: rebuild
          path: ./build-logic

  intelligence:
    container_name: curakid-intelligence
    image: curakid-intelligence:latest
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=4)",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    build:
      context: ./intelligence
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - HF_HOME=/app/hf_cache
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - LAYA_MODEL_NAME=convaiinnovations/laya-multilingual
      - UVICORN_WORKERS=${UVICORN_WORKERS:-1}
      - TORCH_NUM_THREADS=2
    volumes:
      - hf_cache:/app/hf_cache
    networks:
      - curakid-network
    develop:
      watch:
        - action: sync
          path: ./intelligence
          target: /app
          ignore:
            - __pycache__/
            - .venv/
            - venv/
        - action: rebuild
          path: ./intelligence/requirements.txt
    deploy:
      resources:
        limits:
          memory: 2560M

  postgres:
    image: pgvector/pgvector:pg16
    container_name: curakid-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - curakid-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d curakid"]
      interval: 20s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: curakid-redis
    restart: unless-stopped
    command: redis-server --appendonly no --requirepass ${SPRING_DATA_REDIS_PASSWORD} --maxmemory 1024mb --maxmemory-policy volatile-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - curakid-network
    healthcheck:
      test:
        ["CMD", "redis-cli", "-a", "${SPRING_DATA_REDIS_PASSWORD}", "ping"]
      interval: 20s
      timeout: 3s
      retries: 5

  kafka:
    image: apache/kafka:3.8.0
    container_name: curakid-kafka
    restart: unless-stopped
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_SEGMENT_BYTES: 16777216
      KAFKA_JVM_PERFORMANCE_OPTS: "-Xmx192m -Xms64m -XX:+UseG1GC"
    volumes:
      - kafka_data:/var/lib/kafka/data
    tmpfs:
      - /etc/kafka/secrets
      - /mnt/shared/config
    networks:
      - curakid-network
    deploy:
      resources:
        limits:
          memory: 384M
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c '(echo > /dev/tcp/localhost/9092) >/dev/null 2>&1' || exit 1",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

networks:
  curakid-network:
    driver: bridge

volumes:
  postgres_data:
    name: curakid_postgres_data
  redis_data:
    name: curakid_redis_data
  kafka_data:
  hf_cache:
    name: curakid_hf_cache
