<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curakid Admin - Users</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --bg-color: #F3F4F6;
            --surface: #FFFFFF;
            --text-main: #111827;
            --text-muted: #6B7280;
            --border: #E5E7EB;
            --error: #EF4444;
            --success: #10B981;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 280px;
            background-color: var(--surface);
            border-right: 1px solid var(--border);
            padding: 2rem;
            box-shadow: 2px 0 8px rgba(0,0,0,0.05);
        }

        .sidebar h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 2rem;
            margin-top: 0;
        }

        .nav-item {
            display: block;
            padding: 0.75rem 1rem;
            color: var(--text-muted);
            text-decoration: none;
            border-radius: 8px;
            margin-bottom: 0.5rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .nav-item:hover, .nav-item.active {
            background-color: #EEF2FF;
            color: var(--primary);
        }

        .main-content {
            flex: 1;
            padding: 2rem 4rem;
            max-width: 1200px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .header h2 {
            font-size: 1.875rem;
            margin: 0;
            font-weight: 700;
        }

        .card {
            background-color: var(--surface);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            text-align: left;
            padding: 1rem;
            border-bottom: 1px solid var(--border);
        }

        th {
            font-weight: 600;
            color: var(--text-muted);
            background-color: #F9FAFB;
        }

        .badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .badge.admin {
            background-color: #FEE2E2;
            color: #991B1B;
        }

        .badge.user {
            background-color: #EEF2FF;
            color: var(--primary);
        }

        .status-dot {
            height: 10px;
            width: 10px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 5px;
        }
        .status-dot.active { background-color: var(--success); }
        .status-dot.inactive { background-color: var(--error); }

        .alert {
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            display: none;
            font-weight: 500;
        }

        .alert.error {
            background-color: #FEE2E2;
            color: #991B1B;
            display: block;
        }
    </style>
</head>
<body>

    <div th:replace="~{admin/fragments :: sidebar('users')}"></div>

    <div class="main-content">
        <div class="header">
            <h2>System Users</h2>
        </div>

        <div id="status-message" class="alert"></div>

        <div class="card">
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Status</th>
                            <th>ID</th>
                        </tr>
                    </thead>
                    <tbody id="users-table-body">
                        <tr>
                            <td colspan="5" style="text-align: center; color: var(--text-muted);">Loading users...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        if (!localStorage.getItem('curakid_admin_token')) {
            window.location.href = '/admin/ui/login';
        }

        function getAuthHeader() {
            let token = localStorage.getItem('curakid_admin_token');
            if (!token) return {};
            return { 'Authorization': token.startsWith('Bearer ') ? token : 'Bearer ' + token };
        }

        function showMessage(text, type) {
            const el = document.getElementById('status-message');
            el.textContent = text;
            el.className = 'alert ' + type;
            setTimeout(() => el.style.display = 'none', 5000);
        }

        async function fetchUsers() {
            try {
                const response = await fetch('/api/admin/users', {
                    headers: getAuthHeader()
                });
                
                if (!response.ok) throw new Error("Failed to fetch users. Ensure you are authenticated.");

                const users = await response.json();
                const tbody = document.getElementById('users-table-body');
                
                if (users.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: var(--text-muted);">No users found.</td></tr>';
                    return;
                }

                tbody.innerHTML = users.map(user => {
                    const roleClass = user.role === 'ADMIN' ? 'admin' : 'user';
                    const statusClass = user.isActive ? 'active' : 'inactive';
                    const statusText = user.isActive ? 'Active' : 'Inactive';
                    
                    return `
                    <tr>
                        <td style="font-weight: 500;">${user.fullName}</td>
                        <td>${user.email}</td>
                        <td><span class="badge ${roleClass}">${user.role}</span></td>
                        <td><span class="status-dot ${statusClass}"></span> ${statusText}</td>
                        <td style="color: var(--text-muted); font-size: 0.85rem; font-family: monospace;">${user.id}</td>
                    </tr>
                `}).join('');

            } catch (err) {
                showMessage(err.message, 'error');
            }
        }

        // Init
        fetchUsers();
    </script>
</body>
</html>
