<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curakid Admin - Політики</title>
    <th:block th:replace="~{admin/fragments :: head-links}"></th:block>
</head>
<body>

    <div th:replace="~{admin/fragments :: sidebar('policies')}"></div>
    <div th:replace="~{admin/fragments :: scripts}"></div>

    <div class="main-content">
        <div class="header">
            <h2>Керування юридичними документами</h2>
        </div>

        <!-- Add Document Form -->
        <div class="card">
            <h3>Додати новий документ</h3>
            <form id="policy-form">
                <div class="flex-row">
                    <div class="form-group">
                        <label for="doc-type">Тип документу</label>
                        <select id="doc-type" class="form-control">
                            <option value="TERMS">Умови використання (Terms)</option>
                            <option value="PRIVACY_POLICY">Політика конфіденційності (Privacy Policy)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="doc-version">Версія</label>
                        <input type="text" id="doc-version" class="form-control" required placeholder="Напр: 1.0.0">
                    </div>
                </div>

                <div class="form-group">
                    <label for="doc-url">URL документу</label>
                    <input type="url" id="doc-url" class="form-control" required placeholder="https://example.com/terms-v1.0.0.pdf">
                </div>

                <button type="submit" class="btn" id="submit-btn">Зберегти документ</button>
            </form>
        </div>

        <!-- Documents Table -->
        <div class="card">
            <h3>Список документів</h3>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Тип</th>
                            <th>Версія</th>
                            <th>URL</th>
                            <th>Статус</th>
                            <th>Дата публікації</th>
                            <th>Дії</th>
                        </tr>
                    </thead>
                    <tbody id="policies-table-body">
                        <tr>
                            <td colspan="6" style="text-align: center; color: var(--text-muted);">Завантаження...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script th:src="@{/admin/js/policies.js}"></script>
</body>
</html>
