<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curakid Admin - Вікові періоди</title>
    <th:block th:replace="admin/fragments :: head-links"></th:block>
    <style>
        .tips-list {
            margin-top: 0.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .tip-item {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }
        .tip-item input {
            flex: 1;
        }
        .add-tip-btn {
            background-color: var(--success);
            color: white;
            padding: 0.4rem 0.8rem;
            font-size: 0.8rem;
            margin-top: 0.5rem;
        }
        .remove-tip-btn {
            background-color: var(--error);
            color: white;
            padding: 0.4rem 0.8rem;
            font-size: 0.8rem;
        }
        .section-header {
            font-weight: 600;
            margin-top: 1.5rem;
            margin-bottom: 0.75rem;
            color: var(--primary);
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.25rem;
        }
    </style>
</head>
<body>

    <div th:replace="~{admin/fragments :: sidebar('periods')}"></div>

    <div class="main-content">
        <div class="header">
            <h2>Керування віковими періодами</h2>
        </div>

        <div class="card">
            <h3>Додати новий період</h3>
            <form id="add-period-form">
                <div class="flex-row">
                    <div class="form-group">
                        <label for="code">Код</label>
                        <input type="text" id="code" class="form-control" required placeholder="Напр: P0_3M">
                    </div>
                    <div class="form-group">
                        <label for="label">Назва</label>
                        <input type="text" id="label" class="form-control" required placeholder="Напр: 0–3 місяці">
                    </div>
                </div>

                <div class="flex-row">
                    <div class="form-group">
                        <label for="minMonths">Мін. вік (місяці)</label>
                        <input type="number" id="minMonths" class="form-control" required placeholder="0">
                    </div>
                    <div class="form-group">
                        <label for="maxMonths">Макс. вік (місяці)</label>
                        <input type="number" id="maxMonths" class="form-control" required placeholder="3">
                    </div>
                </div>

                <div class="section-header">Опис (JSON)</div>
                <div class="form-group">
                    <label for="title">Заголовок періоду</label>
                    <input type="text" id="title" class="form-control" required placeholder="Напр: Час перших відкриттів">
                </div>
                <div class="form-group">
                    <label for="subtitle">Підзаголовок/Суть</label>
                    <textarea id="subtitle" class="form-control" required placeholder="Короткий опис особливостей..."></textarea>
                </div>

                <div class="section-header">Ключові досягнення (Milestones)</div>
                <div class="form-group">
                    <label for="milestone-movement">Рухова активність</label>
                    <input type="text" id="milestone-movement" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="milestone-speech">Мовлення</label>
                    <input type="text" id="milestone-speech" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="milestone-cognition">Пізнання</label>
                    <input type="text" id="milestone-cognition" class="form-control" required>
                </div>

                <div class="section-header">Поради для батьків (Tips)</div>
                <div id="add-tips-list" class="tips-list">
                    <div class="tip-item">
                        <input type="text" class="form-control tip-input" placeholder="Порада...">
                        <button type="button" class="btn remove-tip-btn" onclick="removeTip(this)">×</button>
                    </div>
                </div>
                <button type="button" class="btn add-tip-btn" onclick="addTip('add-tips-list')">+ Додати пораду</button>

                <div style="margin-top: 2rem;">
                    <button type="submit" class="btn" id="submit-btn">Зберегти період</button>
                </div>
            </form>
        </div>

        <div class="card">
            <h3>Існуючі періоди</h3>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Код</th>
                            <th>Назва</th>
                            <th>Вік (міс)</th>
                            <th>Дії</th>
                        </tr>
                    </thead>
                    <tbody id="periods-table-body">
                        <tr>
                            <td colspan="4" style="text-align: center; color: var(--text-muted);">Завантаження...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="edit-modal" class="modal">
        <div class="modal-content" style="max-width: 800px; max-height: 90vh; overflow-y: auto;">
            <div class="modal-header">
                <h3>Редагувати період</h3>
                <span class="close-modal" onclick="closeModal()">&times;</span>
            </div>
            <form id="edit-period-form">
                <input type="hidden" id="edit-id">
                <div class="flex-row">
                    <div class="form-group">
                        <label for="edit-code">Код</label>
                        <input type="text" id="edit-code" class="form-control">
                    </div>
                    <div class="form-group">
                        <label for="edit-label">Назва</label>
                        <input type="text" id="edit-label" class="form-control">
                    </div>
                </div>

                <div class="flex-row">
                    <div class="form-group">
                        <label for="edit-minMonths">Мін. вік (місяці)</label>
                        <input type="number" id="edit-minMonths" class="form-control">
                    </div>
                    <div class="form-group">
                        <label for="edit-maxMonths">Макс. вік (місяці)</label>
                        <input type="number" id="edit-maxMonths" class="form-control">
                    </div>
                </div>

                <div class="section-header">Опис (JSON)</div>
                <div class="form-group">
                    <label for="edit-title">Заголовок періоду</label>
                    <input type="text" id="edit-title" class="form-control">
                </div>
                <div class="form-group">
                    <label for="edit-subtitle">Підзаголовок/Суть</label>
                    <textarea id="edit-subtitle" class="form-control"></textarea>
                </div>

                <div class="section-header">Ключові досягнення (Milestones)</div>
                <div class="form-group">
                    <label for="edit-milestone-movement">Рухова активність</label>
                    <input type="text" id="edit-milestone-movement" class="form-control">
                </div>
                <div class="form-group">
                    <label for="edit-milestone-speech">Мовлення</label>
                    <input type="text" id="edit-milestone-speech" class="form-control">
                </div>
                <div class="form-group">
                    <label for="edit-milestone-cognition">Пізнання</label>
                    <input type="text" id="edit-milestone-cognition" class="form-control">
                </div>

                <div class="section-header">Поради для батьків (Tips)</div>
                <div id="edit-tips-list" class="tips-list"></div>
                <button type="button" class="btn add-tip-btn" onclick="addTip('edit-tips-list')">+ Додати пораду</button>

                <div style="display: flex; gap: 1rem; justify-content: flex-end; margin-top: 2rem;">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Скасувати</button>
                    <button type="submit" class="btn">Оновити</button>
                </div>
            </form>
        </div>
    </div>

    <div th:replace="~{admin/fragments :: scripts}"></div>

    <script>
        let periods = [];
        let currentDescription = null;
        fetchPeriods();

        function addTip(containerId, value = '') {
            const container = document.getElementById(containerId);
            const div = document.createElement('div');
            div.className = 'tip-item';
            div.innerHTML = `
                <input type="text" class="form-control tip-input" placeholder="Порада..." value="${value}">
                <button type="button" class="btn remove-tip-btn" onclick="removeTip(this)">×</button>
            `;
            container.appendChild(div);
        }

        function removeTip(btn) {
            btn.parentElement.remove();
        }

        function collectTips(containerId) {
            const inputs = document.querySelectorAll(`#${containerId} .tip-input`);
            return Array.from(inputs).map(i => i.value).filter(v => v.trim() !== '');
        }

        function constructDescription(prefix) {
            const tips = collectTips(prefix + 'tips-list');
            return JSON.stringify({
                ua: {
                    title: document.getElementById(prefix + 'title').value,
                    subtitle: document.getElementById(prefix + 'subtitle').value,
                    milestones: {
                        movement: document.getElementById(prefix + 'milestone-movement').value,
                        speech: document.getElementById(prefix + 'milestone-speech').value,
                        cognition: document.getElementById(prefix + 'milestone-cognition').value
                    },
                    tips: tips
                }
            });
        }

        async function fetchPeriods() {
            try {
                const response = await AdminAuth.apiFetch('/api/admin/quiz/life-periods');
                if (!response) return;
                
                if (!response.ok) throw new Error("Помилка завантаження");

                periods = await response.json();
                renderTable();
            } catch (err) {
                AdminAuth.showToast(err.message, 'error');
            }
        }

        function renderTable() {
            const tbody = document.getElementById('periods-table-body');
            if (periods.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align: center;">Періодів не знайдено</td></tr>';
                return;
            }

            tbody.innerHTML = periods.map(p => {
                const safeCode = AdminAuth.escapeHtml(p.code);
                const safeLabel = AdminAuth.escapeHtml(p.label);
                return `
                <tr>
                    <td><span class="badge">${safeCode}</span></td>
                    <td style="font-weight: 500;">${safeLabel}</td>
                    <td>${p.minMonths} – ${p.maxMonths}</td>
                    <td>
                        <button class="action-btn edit-btn" onclick="openEditModal('${p.id}')">Редагувати</button>
                    </td>
                </tr>
            `}).join('');
        }

        document.getElementById('add-period-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                code: document.getElementById('code').value,
                label: document.getElementById('label').value,
                minMonths: parseInt(document.getElementById('minMonths').value),
                maxMonths: parseInt(document.getElementById('maxMonths').value),
                description: constructDescription('')
            };

            try {
                const response = await AdminAuth.apiFetch('/api/admin/quiz/life-periods', {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                if (response && response.ok) {
                    AdminAuth.showToast('Період успішно додано!', 'success');
                    e.target.reset();
                    document.getElementById('add-tips-list').innerHTML = '';
                    addTip('add-tips-list');
                    fetchPeriods();
                }
            } catch (err) {
                AdminAuth.showToast(err.message, 'error');
            }
        });


        function openEditModal(id) {
            const p = periods.find(x => x.id === id);
            if (!p) return;
            document.getElementById('edit-id').value = p.id;
            document.getElementById('edit-code').value = p.code;
            document.getElementById('edit-label').value = p.label;
            document.getElementById('edit-minMonths').value = p.minMonths;
            document.getElementById('edit-maxMonths').value = p.maxMonths;

            // Description may come from the API either as an already parsed object
            // or as a raw JSON string (legacy), so handle both cases.
            let desc = { ua: { title: '', subtitle: '', milestones: { movement: '', speech: '', cognition: '' }, tips: [] } };
            if (p.description && typeof p.description === 'object') {
                desc = p.description;
            } else if (typeof p.description === 'string' && p.description.trim() !== '') {
                try {
                    desc = JSON.parse(p.description);
                } catch (e) {
                    console.error("Failed to parse description", e);
                    desc.ua.subtitle = p.description; // fallback if not JSON
                }
            }
            currentDescription = desc;

            const data = desc.ua || desc;
            document.getElementById('edit-title').value = data.title || '';
            document.getElementById('edit-subtitle').value = data.subtitle || '';
            document.getElementById('edit-milestone-movement').value = data.milestones?.movement || '';
            document.getElementById('edit-milestone-speech').value = data.milestones?.speech || '';
            document.getElementById('edit-milestone-cognition').value = data.milestones?.cognition || '';

            // Tips
            const tipsContainer = document.getElementById('edit-tips-list');
            tipsContainer.innerHTML = '';
            if (data.tips && Array.isArray(data.tips)) {
                data.tips.forEach(t => addTip('edit-tips-list', t));
            } else if (data.tip) { // legacy single tip
                addTip('edit-tips-list', data.tip);
            }
            if (tipsContainer.children.length === 0) {
                addTip('edit-tips-list');
            }

            document.getElementById('edit-modal').classList.add('open');
        }

        function closeModal() {
            document.getElementById('edit-modal').classList.remove('open');
        }

        function constructEditDescription() {
            const base = currentDescription || { ua: {} };
            const ua = base.ua || base;
            const existingMilestones = ua.milestones || {};

            const title = document.getElementById('edit-title').value.trim();
            const subtitle = document.getElementById('edit-subtitle').value.trim();
            const movement = document.getElementById('edit-milestone-movement').value.trim();
            const speech = document.getElementById('edit-milestone-speech').value.trim();
            const cognition = document.getElementById('edit-milestone-cognition').value.trim();
            const tips = collectTips('edit-tips-list');

            // Nothing changed in the description block — keep the existing value.
            if (!title && !subtitle && !movement && !speech && !cognition && tips.length === 0) {
                return undefined;
            }

            const merged = {
                ...ua,
                ...(title ? { title } : {}),
                ...(subtitle ? { subtitle } : {}),
                milestones: {
                    ...existingMilestones,
                    ...(movement ? { movement } : {}),
                    ...(speech ? { speech } : {}),
                    ...(cognition ? { cognition } : {})
                },
                ...(tips.length > 0 ? { tips } : {})
            };

            // Preserve the original shape: some records are stored with a
            // language wrapper (`ua`), while older ones are stored flat.
            return JSON.stringify(base.ua ? { ...base, ua: merged } : merged);
        }

        document.getElementById('edit-period-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('edit-id').value;

            // Send only the fields that were actually filled in, so the backend
            // can perform a partial update without overwriting existing values.
            const payload = {};
            const code = document.getElementById('edit-code').value.trim();
            const label = document.getElementById('edit-label').value.trim();
            const minMonths = document.getElementById('edit-minMonths').value;
            const maxMonths = document.getElementById('edit-maxMonths').value;
            const description = constructEditDescription();

            if (code) payload.code = code;
            if (label) payload.label = label;
            if (minMonths !== '' && !isNaN(parseInt(minMonths))) payload.minMonths = parseInt(minMonths);
            if (maxMonths !== '' && !isNaN(parseInt(maxMonths))) payload.maxMonths = parseInt(maxMonths);
            if (description !== undefined) payload.description = description;

            try {
                const response = await AdminAuth.apiFetch('/api/admin/quiz/life-periods/' + id, {
                    method: 'PUT',
                    body: JSON.stringify(payload)
                });
                if (response && response.ok) {
                    AdminAuth.showToast('Період оновлено!', 'success');
                    closeModal();
                    fetchPeriods();
                }
            } catch (err) {
                AdminAuth.showToast(err.message, 'error');
            }
        });
    </script>
</body>
</html>
