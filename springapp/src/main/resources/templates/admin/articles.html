<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curakid Admin - Knowledge Base</title>
    <th:block th:replace="admin/fragments :: head-links"></th:block>
</head>
<body>

    <div th:replace="~{admin/fragments :: sidebar('articles')}"></div>
    <div th:replace="~{admin/fragments :: scripts}"></div>

    <div class="main-content">
        <div class="header">
            <h2>База знань (Статті)</h2>
        </div>

        
        <div class="card fade-in" style="margin-bottom: 2rem;">
            <h3>Керування категоріями</h3>
            <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Створіть категорії для статей (напр. Харчування, Розвиток).</p>
            
            <form id="add-category-form" style="display: flex; gap: 1rem; align-items: flex-end; flex-wrap: wrap;">
                <div class="form-group" style="flex: 1; min-width: 200px; margin-bottom: 0;">
                    <label for="cat-name">Технічна назва (ID)</label>
                    <input type="text" id="cat-name" class="form-control" required placeholder="NUTRITION">
                </div>
                <div class="form-group" style="flex: 1; min-width: 200px; margin-bottom: 0;">
                    <label for="cat-display">Назва для відображення</label>
                    <input type="text" id="cat-display" class="form-control" required placeholder="Харчування">
                </div>
                <button type="submit" class="btn">Додати категорію</button>
            </form>
        </div>

        <div class="card fade-in">
            <h3>Додати нову статтю</h3>
            <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Контент буде векторизовано та збережено для інтелектуального пошуку (RAG).</p>
            
            <form id="add-article-form">
                <div class="form-group">
                    <label for="title">Заголовок</label>
                    <input type="text" id="title" class="form-control" required placeholder="Напр: Ознаки аутизму у малюків">
                </div>
                
                <div class="form-group">
                    <label for="category">Категорія</label>
                    <select id="category" class="form-control" required>
                        <option value="">Завантаження категорій...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="content">Текст статті</label>
                    <textarea id="content" class="form-control" required placeholder="Вставте повний текст медичного протоколу або статті тут..."></textarea>
                </div>

                <button type="submit" class="btn" id="submit-btn">
                    <span>Зберегти та згенерувати вектори</span>
                </button>
            </form>
        </div>

        <div class="card fade-in" style="margin-top: 2rem;">
            <h3>Існуючі статті</h3>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Заголовок</th>
                            <th>Категорія</th>
                            <th>Дії</th>
                        </tr>
                    </thead>
                    <tbody id="articles-table-body">
                        <tr>
                            <td colspan="3" style="text-align: center; color: var(--text-muted);">Завантаження статей...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        initPage();

        async function initPage() {
            await fetchCategories();
            await fetchArticles();
        }


        let categories = [];

        async function fetchCategories() {
            try {
                const response = await AdminAuth.apiFetch('/api/admin/knowledge/categories');
                if (!response) return;
                categories = await response.json();
                
                const select = document.getElementById('category');
                if (categories.length === 0) {
                    select.innerHTML = '<option value="">Немає категорій - будь ласка, створіть спочатку</option>';
                } else {
                    select.innerHTML = categories.map(c => `
                        <option value="${c.id}">${c.displayName} (${c.name})</option>
                    `).join('');
                }
            } catch (err) {
                AdminAuth.showToast('Не вдалося завантажити категорії', 'error');
            }
        }

        async function fetchArticles() {
            try {
                const response = await AdminAuth.apiFetch('/api/admin/knowledge');
                if (!response) return;
                
                if (!response.ok) throw new Error("Failed to fetch articles");

                const articles = await response.json();
                const tbody = document.getElementById('articles-table-body');
                
                if (articles.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="3" style="text-align: center; color: var(--text-muted);">Статей не знайдено.</td></tr>';
                    return;
                }

                tbody.innerHTML = articles.map(art => {
                    const cat = art.category ? art.category.displayName : 'Без категорії';
                    return `
                    <tr>
                        <td style="font-weight: 500;">${escapeHtml(art.title)}</td>
                        <td><span class="badge">${escapeHtml(cat)}</span></td>
                        <td>
                            <button class="delete-btn" onclick="deleteArticle('${art.id}')">Видалити</button>
                        </td>
                    </tr>
                    `;
                }).join('');

            } catch (err) {
                AdminAuth.showToast(err.message, 'error');
            }
        }

        document.getElementById('add-article-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            
            const payload = {
                title: document.getElementById('title').value,
                categoryId: document.getElementById('category').value,
                content: document.getElementById('content').value
            };

            try {
                btn.disabled = true;
                btn.textContent = 'Обробка...';

                const response = await AdminAuth.apiFetch('/api/admin/knowledge', {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });

                if (response && response.ok) {
                    AdminAuth.showToast('Статтю збережено та векторизовано успішно!', 'success');
                    e.target.reset();
                    await fetchArticles();
                }

            } catch (err) {
                AdminAuth.showToast(err.message, 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Зберегти та згенерувати вектори';
            }
        });

        document.getElementById('add-category-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                name: document.getElementById('cat-name').value.toUpperCase(),
                displayName: document.getElementById('cat-display').value
            };

            try {
                const response = await AdminAuth.apiFetch('/api/admin/knowledge/categories', {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });

            if (response && response.ok) {
                AdminAuth.showToast('Категорію додано!', 'success');
                e.target.reset();
                await fetchCategories();
            }
        } catch (err) {
            AdminAuth.showToast(err.message, 'error');
        }
    });

    async function deleteArticle(id) {
        if (!confirm('Ви впевнені, що хочете видалити цю статтю?')) return;

        try {
            const response = await AdminAuth.apiFetch('/api/admin/knowledge/' + id, {
                method: 'DELETE'
            });

            if (response && response.ok) {
                AdminAuth.showToast('Статтю видалено.', 'success');
                await fetchArticles();
            }
        } catch (err) {
            AdminAuth.showToast(err.message, 'error');
        }
    }

        function escapeHtml(unsafe) {
            return (unsafe || '').toString()
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
