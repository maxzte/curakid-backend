version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: springapp/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_MAIL_HOST=${SPRING_MAIL_HOST}
      - SPRING_MAIL_PORT=${SPRING_MAIL_PORT}
      - SPRING_MAIL_USERNAME=${SPRING_MAIL_USERNAME}
      - SPRING_MAIL_PASSWORD=${SPRING_MAIL_PASSWORD}
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/curakid}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD:-postgres_password}
      - SPRING_DATA_REDIS_HOST=${SPRING_DATA_REDIS_HOST:-redis}
      - SPRING_DATA_REDIS_PORT=${SPRING_DATA_REDIS_PORT:-6379}
      - SPRING_DATA_REDIS_PASSWORD=${SPRING_DATA_REDIS_PASSWORD:-redis_password}
      - GOOGLE_AI_API_KEY=${GOOGLE_AI_API_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - FIREBASE_CREDENTIALS_PATH=/app/serviceAccountKey.json
      - SPRING_AI_GOOGLE_GENAI_EMBEDDING_MODEL=text-embedding-004
      - SPRING_MAIN_LAZY_INITIALIZATION=true
      - SPRING_JMX_ENABLED=false
      - SPRING_JPA_PROPERTIES_HIBERNATE_QUERY_PLAN_CACHE_MAX_SIZE=64
      - JAVA_OPTS=-Xmx256m -Xms128m -XX:MetaspaceSize=128m -XX:MaxMetaspaceSize=192m -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8080/api/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M
    volumes:
      - ./serviceAccountKey.json:/app/serviceAccountKey.json:ro
    networks:
      - curakid-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      intelligence:
        condition: service_healthy
    develop:
      watch:
        - action: rebuild
          path: ./springapp
        - action: rebuild
          path: ./core/essential
        - action: rebuild
          path: ./core/security
        - action: rebuild
          path: ./core/database
        - action: rebuild
          path: ./feature/auth
        - action: rebuild
          path: ./feature/children
        - action: rebuild
          path: ./feature/development
        - action: rebuild
          path: ./feature/measurements
        - action: rebuild
          path: ./feature/knowledge
        - action: rebuild
          path: ./feature/reports
        - action: rebuild
          path: ./feature/notification
        - action: rebuild
          path: ./feature/fis
        - action: rebuild
          path: ./feature/vaccine
        - action: rebuild
          path: ./build-logic

  intelligence:
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    build:
      context: ./intelligence
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - HF_HOME=/app/hf_cache
      - HF_HUB_OFFLINE=0
      - TRANSFORMERS_OFFLINE=0
    networks:
      - curakid-network
    develop:
      watch:
        - action: sync
          path: ./intelligence
          target: /app
          ignore:
            - __pycache__/
            - .venv/
            - venv/
        - action: rebuild
          path: ./intelligence/requirements.txt
    deploy:
      resources:
        limits:
          memory: 350M

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: curakid
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - curakid-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d curakid" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: curakid-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_password}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - curakid-network
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_password}", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

networks:
  curakid-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
