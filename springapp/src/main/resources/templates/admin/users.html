<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curakid Admin - Users</title>
    <th:block th:replace="admin/fragments :: head-links"></th:block>
</head>
<body>

    <div th:replace="~{admin/fragments :: sidebar('users')}"></div>
    <div th:replace="~{admin/fragments :: scripts}"></div>

    <div class="main-content">
        <div class="header">
            <h2>Користувачі системи</h2>
        </div>

        <div class="card" style="margin-bottom: 1.5rem;">
            <div class="flex-row" style="gap: 1rem; align-items: flex-end;">
                <div class="form-group" style="flex: 1; margin-bottom: 0;">
                    <label for="search-email">Пошук за Email</label>
                    <input type="text" id="search-email" class="form-control" placeholder="Введіть частину email...">
                </div>
                <button class="btn" onclick="applySearch()">Пошук</button>
                <button class="btn btn-secondary" onclick="resetSearch()">Скинути</button>
            </div>
        </div>

        <div class="card">
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Ім'я</th>
                            <th>Email</th>
                            <th>Роль</th>
                            <th>Статус</th>
                            <th>ID</th>
                            <th>Дії</th>
                        </tr>
                    </thead>
                    <tbody id="users-table-body">
                        <tr>
                            <td colspan="6" style="text-align: center; color: var(--text-muted);">Завантаження користувачів...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="pagination-container" id="pagination-container" style="margin-top: 1.5rem; display: flex; justify-content: center; gap: 0.5rem;">
                <!-- Pagination buttons will be here -->
            </div>
        </div>
    </div>

    <script>
        let currentPage = 0;
        let currentSearch = '';

        async function fetchUsers(page = 0, email = '') {
            currentPage = page;
            currentSearch = email;

            try {
                const url = `/api/v1/admin/users?page=${page}&size=20&email=${encodeURIComponent(email)}`;
                const response = await AdminAuth.apiFetch(url);
                if (!response) return;
                
                if (!response.ok) throw new Error("Помилка завантаження користувачів.");

                const data = await response.json();
                const users = data.items;
                const tbody = document.getElementById('users-table-body');
                
                if (users.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: var(--text-muted);">Користувачів не знайдено.</td></tr>';
                    renderPagination(0, 0);
                    return;
                }

                tbody.innerHTML = users.map(user => {
                    const isActive = user.isActive === true || user.active === true;
                    const isAdmin = user.role === 'ROLE_ADMIN';
                    const roleClass = isAdmin ? 'admin' : 'user';
                    const roleName = isAdmin ? 'Адмін' : 'Користувач';
                    const statusClass = isActive ? 'active' : 'inactive';
                    const statusText = isActive ? 'Активний' : 'Неактивний';
                    
                    return `
                    <tr>
                        <td style="font-weight: 500;">${AdminAuth.escapeHtml(user.fullName)}</td>
                        <td>${AdminAuth.escapeHtml(user.email)}</td>
                        <td><span class="badge ${roleClass}">${roleName}</span></td>
                        <td><span class="status-dot ${statusClass}"></span> ${statusText}</td>
                        <td style="color: var(--text-muted); font-size: 0.85rem; font-family: monospace;">${AdminAuth.escapeHtml(user.id)}</td>
                        <td>
                            ${isActive ? `<button class="action-btn delete-btn" onclick="deleteUser('${AdminAuth.escapeHtml(user.id)}')">Видалити</button>` : ''}
                        </td>
                    </tr>
                `}).join('');

                renderPagination(data.totalPages, data.currentPage);

            } catch (err) {
                AdminAuth.showToast(err.message, 'error');
            }
        }

        function renderPagination(totalPages, current) {
            const container = document.getElementById('pagination-container');
            if (totalPages <= 1) {
                container.innerHTML = '';
                return;
            }

            const DOTS = '...';
            const neighbors = 2; // скільки сторінок показуємо з обох боку поточної

            const visible = new Set();
            visible.add(0);
            visible.add(totalPages - 1);
            for (let i = Math.max(0, current - neighbors); i <= Math.min(totalPages - 1, current + neighbors); i++) {
                visible.add(i);
            }

            const sorted = Array.from(visible).sort((a, b) => a - b);

            let html = '';
            // Previous
            html += `<button class="btn btn-sm pagination-btn ${current === 0 ? 'disabled' : ''}" onclick="fetchUsers(${current - 1}, '${currentSearch}')" ${current === 0 ? 'disabled' : ''}>←</button>`;

            let prev = null;
            sorted.forEach(i => {
                if (prev !== null && i > prev + 1) {
                    html += `<span class="pagination-dots">${DOTS}</span>`;
                }
                if (i === current) {
                    html += `<button class="btn btn-sm pagination-btn active" disabled>${i + 1}</button>`;
                } else {
                    html += `<button class="btn btn-sm pagination-btn" onclick="fetchUsers(${i}, '${currentSearch}')">${i + 1}</button>`;
                }
                prev = i;
            });

            // Next
            html += `<button class="btn btn-sm pagination-btn ${current === totalPages - 1 ? 'disabled' : ''}" onclick="fetchUsers(${current + 1}, '${currentSearch}')" ${current === totalPages - 1 ? 'disabled' : ''}>→</button>`;

            container.innerHTML = html;
        }

        function applySearch() {
            const email = document.getElementById('search-email').value;
            fetchUsers(0, email);
        }

        function resetSearch() {
            document.getElementById('search-email').value = '';
            fetchUsers(0, '');
        }

        async function deleteUser(id) {
            if (!confirm('Ви впевнені, що хочете видалити цього користувача? Це призведе до анонімізації всіх його даних та даних його дітей.')) return;
            try {
                const response = await AdminAuth.apiFetch('/api/v1/admin/users/' + id, {
                    method: 'DELETE'
                });
                if (response && response.ok) {
                    AdminAuth.showToast('Користувача видалено та анонімізовано', 'success');
                    fetchUsers(currentPage, currentSearch);
                }
            } catch (err) {
                AdminAuth.showToast(err.message, 'error');
            }
        }

        fetchUsers();
    </script>
</body>
</html>
