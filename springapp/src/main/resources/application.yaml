spring:
  application:
    name: curakid

  autoconfigure:
    exclude:
      - io.sentry.spring.boot.jakarta.SentryAutoConfiguration

  threads:
    virtual:
      enabled: true

  lifecycle:
    timeout-per-shutdown-phase: 30s

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  datasource:
#    driver-class-name: org.postgresql.Driver
#    url: ${SPRING_DATASOURCE_URL}
#    username: ${SPRING_DATASOURCE_USERNAME}
#    password: ${SPRING_DATASOURCE_PASSWORD}

    #    FOR LOCAL DEV
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000
      keepalive-time: 30000
      max-lifetime: 1800000
      leak-detection-threshold: 10000
      validation-timeout: 3000

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:redis_password}
      timeout: 2000ms

  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 3000
          writetimeout: 5000
        debug: false

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          timezone: UTC
          use_get_generated_keys: true

  ai:
    vectorstore:
      pgvector:
        initialize-schema: true
    google:
      genai:
        chat:
          options:
            model: gemini-2.5-flash-lite
        api-key: ${GOOGLE_AI_API_KEY}
        embedding:
          text:
            options:
              dimensions: 768
          api-key: ${GOOGLE_AI_API_KEY}
  sql:
    init:
      mode: always

fis:
  base-url: ${FIS_BASE_URL:http://localhost:8000}
  internal-api-key: ${INTERNAL_API_KEY}
  timeout-seconds: 10

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:900000}    # 15 minutes
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000} # 7 days

firebase:
  credentials-path: ${FIREBASE_CREDENTIALS_PATH:}

google:
  client-id: ${GOOGLE_CLIENT_ID}

logging:
  level:
#    com.misterio.curakid: DEBUG
#    web: DEBUG
#    web.filter.CommonsRequestLoggingFilter: DEBUG
    root: INFO
    org.springframework: INFO
    hibernate: INFO

# Зменшуємо максимальну кількість робочих потоків до 20 (замість 200)
server:
  port: 8080
  shutdown: graceful
  tomcat:
    threads:
      max: 20
      # Мінімальна кількість потоків у спокої
      min-spare: 5
  # Скільки запитів може стояти в черзі, коли всі потоки зайняті
  accept-count: 200
  # Максимальна кількість одночасних з'єднань, які Tomcat може тримати
  max-connections: 1000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080}

sentry:
  dsn: ${SENTRY_DSN:}
  traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:0.1}
  send-default-pii: false